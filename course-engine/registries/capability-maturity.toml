# ── the ledger's own row — it expires like everything else ─────────────────
# `test-backed`, not `gate-wired`, and deliberately so: at the moment this row
# was written the gate ran under cargo test and scripts/check.sh did not call it.
# BUILT != WIRED. Raise this to gate-wired in the same commit that adds the
# check.sh step, and to proven-to-trip when that step is asserted to stop the
# chain — not before.
[[capability]]
id = "ledger.capability-maturity"
title = "Capability claims are attributed, dated, and point at something that exists"
level = "proven-to-trip"
owner = "josh"
last_review = "2026-08-14"
claim = "Every row of this file names a level from a fixed lattice, an owner, a review date that expires after the policy window, and evidence that resolves to a real file, a real named test function or a real commit; the level's evidence obligation and the quoted CHARTER cell are both checked."
evidence = [
  { kind = "test", ref = "crates/cdcp_gate/tests/capability_maturity_e2e.rs::the_live_ledger_is_schema_clean_and_its_findings_are_the_named_debts" },
  { kind = "known_bad", ref = "crates/cdcp_gate/tests/capability_maturity_e2e.rs::bad_expired_row_is_red_and_names_the_row_and_its_age" },
  { kind = "known_bad", ref = "crates/cdcp_gate/tests/capability_maturity_e2e.rs::bad_dangling_test_ref_is_red_and_names_row_and_ref" },
  { kind = "contract", ref = "registries/capability-maturity.toml" },
  # Raised test-backed -> proven-to-trip 2026-08-14, when the check.sh step landed.
  # It was HONESTLY test-backed while written, because the gate existed and nothing
  # called it (decalogue 10). The lattice reads this level off the evidence: a test,
  # a contract, and >=1 known_bad. What it does NOT assert is that check.sh's
  # `|| fail` propagates — that is the same claim --prove-wired had to settle
  # behaviourally for the substrate guard, and nothing settles it here yet.
  { kind = "contract", ref = "scripts/check.sh" },
]

