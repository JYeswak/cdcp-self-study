evidence = [
  { kind = "test", ref = "crates/cdcp_registry_check/src/lib.rs::real_repo_is_clean" },
  { kind = "known_bad", ref = "crates/cdcp_registry_check/src/lib.rs::empty_claims_is_error" },
  { kind = "known_bad", ref = "crates/cdcp_registry_check/src/lib.rs::lattice_rejects_weaker_justifier" },
  { kind = "known_bad", ref = "crates/cdcp_registry_check/src/lib.rs::marker_unresolved_is_error" },
  { kind = "contract", ref = "registries/claims.toml" },
  { kind = "contract", ref = "scripts/check.sh" },
]

# ── L2 ─────────────────────────────────────────────────────────────────────
# RED ON PURPOSE. CHARTER §5 publishes "YES · wired"; the honest level is two
# rungs lower. slo.toml's budgets are enforced by one shell script that carries a
# documented CDCP_SKIP_SLO=1 bypass, runs only when `export-web --help` succeeds,
# and has no known-bad proving it can go red. NO NAMED TEST FUNCTION ANYWHERE IN
# THIS TREE ASSERTS AN SLO BUDGET, so this row cannot honestly name one, and the
# gate refuses to let the CHARTER cell stand unbacked.
# Fix in either direction, deliberately: write the test and raise the level, or
# correct the CHARTER cell to what the machinery actually does.
[[capability]]
id = "l2.slo-as-code"
title = "Wall-clock performance budgets enforced as code"
level = "smoke-checked"
owner = "josh"
last_review = "2026-08-14"
claim = "slo.toml records grade/export/bank-verify wall budgets and scripts/smoke_slo.sh fails check.sh when one is exceeded; no named test asserts a budget, the step is conditional on the export-web verb, and CDCP_SKIP_SLO=1 turns it off."
charter_claim = { file = "CHARTER.md", row = "L2 SLO-as-code", status = "PARTIAL · smoke-checked" }
evidence = [
  { kind = "contract", ref = "slo.toml" },
  { kind = "contract", ref = "scripts/smoke_slo.sh" },
  { kind = "contract", ref = "scripts/check.sh" },
]

