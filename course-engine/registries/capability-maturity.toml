# =============================================================================
# capability-maturity.toml — the machine ledger of what this repo can actually do
# (bd-hardening-b-ledgers-gvm.1 · milestone B · pattern: frankensim
# capability-maturity.json, schema frankensim-capability-maturity-v1)
# =============================================================================
#
# WHY THIS FILE EXISTS
#
# `L3 External oracle | YES · wired` sat in CHARTER §5 for months on internal-only
# evidence. Nothing could mechanically contradict it, because a maturity claim in
# a prose table has no falsifier: editing one cell is cheaper than building the
# capability, and both look identical in a diff. Commit 467b429 fixed that one
# row. This file removes the class.
#
# Every row here names a LEVEL from a fixed lattice, an OWNER, a REVIEW DATE that
# expires, and EVIDENCE that must resolve to a file or to a named test function
# that exists in this tree. `crates/cdcp_gate/src/gates/capability_maturity.rs`
# reads it; `scripts/check.sh` is where it becomes load-bearing.
#
# THE LEVEL LATTICE (rank ascending — the gate compiles these in; this file may
# not add, rename or reorder them)
#
#   absent          0  the capability does not exist here          >=1 contract
#   declared        1  artifacts exist; nothing runs them          >=1 contract
#   smoke-checked   2  a script/shell step checks it, no named test>=1 contract
#   test-backed     3  >=1 named test function exercises it        >=1 test
#   gate-wired      4  test-backed AND a check.sh step fails red   >=1 test + contract
#   proven-to-trip  5  plus a known-bad injection asserted RED     >=1 test + contract + known_bad
#
# `charter_claim` is the cross-check that makes the prose falsifiable: the row
# quotes the exact cell CHARTER.md publishes for this capability. If the cell
# text moves, the ledger is RED for drift. If the cell says "wired" and the
# ledger's level is below `gate-wired`, the ledger is RED for the overclaim —
# which is precisely the shape of the L3 failure, caught mechanically.
#
# A ROW THAT IS RED IS NOT A BUG IN THIS FILE. It is the repo telling the truth
# about itself. Fix the capability, or fix the claim. Never both-ways: silencing
# a row by lowering a level while the CHARTER keeps the claim is the failure this
# ledger exists to make impossible to do quietly.
#
# HOW TO REVIEW A ROW
#   1. Re-read the evidence. Does the named test still assert what the claim says?
#   2. Re-read the CHARTER cell. Does it still say what `charter_claim` records?
#   3. Only then bump `last_review`. A date bumped without step 1 is the same
#      defect in a newer coat.
# =============================================================================

schema_version = 1

[policy]
# A row unreviewed for longer than this is RED. The gate compiles in this value
# as a CEILING: the registry may tighten it, never loosen it.
staleness_days = 90

