# WAS RED ON PURPOSE — this is the record of the first walk, kept because it is
# the evidence the ledger was never vacuous.
#
# Seeded 2026-08-14 from the COMMITTED tree, and RED on its first run with ten
# violations, because C2 (bd-hardening-c-status-hzs.2) was moving BOTH bank
# surfaces in the working tree while this file was being written: `objective_ids`,
# `citation_ids` and `tags` joined BankItem; those three plus `status` joined
# hash_payload; compute_bank_hash gained an empty-bank guard. All seven artifacts
# below were re-frozen on disk at 15:44 with nothing recording that a surface had
# moved — the defect PLAN §B2 describes, caught in the act rather than argued for.
#
# CLEARED 2026-08-14 by the walk this file exists to impose, in PROVENANCE's
# order: C2 and C3 landed, the four-command regeneration block ran, then every
# pin was re-extracted, both versions re-derived, all seven `frozen` digests
# re-taken and every `depends_on` re-affirmed. Nothing here was cleared by
# pasting in what the tree said; each row was walked, and the two rows whose
# MEANING changed are rewritten below rather than re-dated.
[[surface]]
id = "bank.item-schema"
title = "The BankItem struct — what a bank file may carry and what serialises"
version = "ve4a98becddb0"
justification = "web/data/bank_items_seed42.json is serde_json over these fields verbatim, so the pack's shape IS this list. C2 also closed the gap this pin was written to expose: `objective_ids`, `citation_ids` and `tags` are now on the struct AND in hash_payload, so no modelled field is content the bank_hash misses. `objective_ids` in particular had never been a field at all — all 804 files carried it on disk and serde discarded it on load — so this list is now the first place that records it exists."
[[surface.pin]]
kind = "fields"
file = "crates/cdcp_bank/src/lib.rs"
symbol = "BankItem"
expect = [
  "id",
  "module",
  "stem",
  "choices",
  "correct",
  "explanation",
  "topic_ids",
  "objective_ids",
  "citation_ids",
  "tags",
  "bloom",
  "source_class",
  "quantity_evidence",
  "status",
]

# WHAT THE C2 CHANGE MEANT, since this is the surface that moved furthest.
#
# `status` entering the payload INVERTS a documented property. PROVENANCE §"Bank
# drift" was built on status being absent: a selection-only edit — approving or
# retiring an item — moved the fixture while this hash held. It no longer does.
# Retiring m14-q040 (C3) now moves bank_hash by itself, which is why the two
# beads had to re-freeze together and why the domain string is wrong until
# bd-6ycw bumps it: two different definitions are both still labelled v1.
#
# The `const` pin below is therefore RIGHT and WRONG at once — it faithfully
# records what the source says, and what the source says is stale. That is the
# correct state for a ledger: it pins reality, and bd-6ycw is the bead that moves
# reality. When it lands, this surface goes RED again and the walk repeats — one
# deliberate move rather than two silent ones.
[[surface]]
id = "bank.hash-payload"
title = "The bank_hash content address — which item fields it covers"
version = "vb16701344b7e"
justification = "bank_hash is pinned by goldens/bank_hash.txt, embedded in the fixture and in every web pack, and compared inside grade() before a report is produced. Which keys enter this payload decides which bank edits are visible to any of them. Since C2 that set includes `status`, so the content address now covers the approved/retired selection itself — the property PROVENANCE §\"Bank drift\" was written against. deny_unknown_fields plus hash_payload_covers_every_modelled_field keep the two sides equal, so a field cannot be added to the struct and quietly sit outside the address again."
[[surface.pin]]
kind = "keys"
file = "crates/cdcp_bank/src/lib.rs"
symbol = "hash_payload"
expect = [
  "id",
  "module",
  "stem",
  "choices",
  "correct",
  "explanation",
  "topic_ids",
  "objective_ids",
  "citation_ids",
  "tags",
  "bloom",
  "source_class",
  "quantity_evidence",
  "status",
]
[[surface.pin]]
kind = "const"
file = "crates/cdcp_core/src/lib.rs"
symbol = "BANK_HASH_DOMAIN"
expect = ['b"cdcp-bank-v1\0"']
[[surface.pin]]
kind = "region"
file = "crates/cdcp_bank/src/lib.rs"
symbol = "compute_bank_hash"
digest = "f3bc025977b558e2173865be7ca4a7cc8a1c2e7e67e5908d7ccd156efbc3d01c"

