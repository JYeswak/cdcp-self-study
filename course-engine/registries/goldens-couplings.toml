# =============================================================================
# goldens-couplings.toml — what each frozen artifact was frozen AGAINST
# (bd-hardening-b-ledgers-gvm.2 · milestone B · pattern: frankensim
# golden-couplings.json, whose note states the rule exactly: "an upstream
# semantic change must point at every downstream golden to re-freeze
# deliberately, never silently")
# =============================================================================
#
# WHY THIS FILE EXISTS
#
# PLAN §B2 calls this a LIVE DEFECT, and it was: `UPDATE_GOLDENS=1 cargo run -p
# cdcp_cli -- goldens generate` rewrites the digests, `goldens check` recomputes
# them from the same code that just changed, and the pair agrees again. A grader
# semantics change and a bank typo fix produce the same diff — two hex strings —
# and nothing anywhere recorded that a SURFACE had moved.
#
# HOW THE HOLE IS CLOSED — four steps, in this order, none of them optional
#
#   1. A `[[surface]]` pin is re-extracted on every run. `keys` pins are
#      re-read from the serialised JSON artifact; every other kind is re-read
#      from source. The declared origin moves  ->  RED, naming both sides.
#   2. `version` is DERIVED from the surface's own pin block (a hand-written
#      label can be left alone while the thing it names moves — that is the
#      defect, not the cure). Repairing a pin  ->  RED until the version is
#      re-derived.
#   3. Every `[[golden]]` affirms each surface AT A VERSION. A bumped version
#      ->  RED on every golden that had not re-affirmed.
#   4. `frozen` is the sha256 of the golden's bytes. A re-freeze  ->  RED on its
#      own row, whatever else held.
#
# So a semantics change now costs a walk of this file, and a re-freeze cannot
# happen without the walk. That cost is the deliverable.
#
# WHAT THIS FILE DOES NOT DO — read `crates/cdcp_gate/src/gates/goldens_couplings.rs`
# for the full ceiling. It cannot decide that a golden is CORRECT (a digest over
# a wrong answer key is pinned exactly as firmly as a right one), that a
# justification is honest, or that anybody re-read anything before re-dating a
# row. It decides that a coupling is declared, resolvable, and current.
#
# A ROW THAT IS RED IS NOT A BUG IN THIS FILE. It is the repo telling you a
# surface moved under a frozen artifact. Fix the pin and re-affirm, or restore
# the source — never both-ways, and never by deleting the row.
#
# WHAT THE PINS DESCRIBE
#
# The COMMITTED tree, always — the state in which the artifacts below and the
# source above them last agreed. A working tree that has moved either side is
# supposed to be red here; that is the whole signal. Never re-pin from a tree
# whose own gates disagree with each other, because a coupling recorded from an
# inconsistent state is worse than none: it reads exactly like one that held.
#
# HOW TO REPAIR A ROW (the whole procedure)
#   1. Run `cargo build -p cdcp_gate --locked` then
#      `./target/debug/cdcp_gate goldens-couplings`. Every finding prints
#      the registry side and the source side; there is nothing to compute.
#   2. Decide what the source change MEANT for each golden below it. That is the
#      step this file exists to force. Write it into `justification`.
#   3. Re-freeze the goldens with the four-command block in
#      `goldens/PROVENANCE.md` — that block is still the only regeneration path.
#   4. Paste the new pin values, the derived `version`, the new `frozen`
#      digests, and today's date into the rows this touched.
# =============================================================================

schema_version = 1

[policy]
# A golden unaffirmed for longer than this is RED. The gate compiles this value
# in as a CEILING: the registry may tighten it, never loosen it.
affirmation_days = 365

# ── semantic surfaces ──────────────────────────────────────────────────────
# Each surface is a thing that, when it moves, changes what a golden should
# contain. `version` is derived; do not invent one.

[[surface]]
id = "core.schema-version"
title = "The schema version stamped into every GradeReport"
version = "ve1cc74b2e52b"
justification = "cdcp_grade writes SCHEMA_VERSION into the report body, so canonical_json covers it and every grade digest below moves when it is bumped. It is the only version constant in the tree, which is exactly why a golden must name it rather than assume it."
[[surface.pin]]
kind = "const"
file = "crates/cdcp_core/src/lib.rs"
symbol = "SCHEMA_VERSION"
expect = ["1"]

[[surface]]
id = "core.grade-report-shape"
title = "The serialised shape of GradeReport and its members"
version = "v0e105134e087"
justification = "The grade goldens are sha256 over canonical_json(GradeReport). Adding, removing, renaming or reordering a field changes those bytes for every attempt, so the frozen digests are a function of this shape and of nothing else about the type."
[[surface.pin]]
kind = "fields"
file = "crates/cdcp_core/src/lib.rs"
symbol = "GradeReport"
expect = [
  "schema_version",
  "bank_hash",
  "exam_id",
  "seed",
  "item_results",
  "score_correct",
  "score_total",
  "by_module",
  "weak_modules",
  "passed_study_signal",
]
