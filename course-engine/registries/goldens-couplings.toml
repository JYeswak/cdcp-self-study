# WHAT THE C2 CHANGE MEANT, since this is the surface that moved furthest.
#
# `status` entering the payload INVERTS a documented property. PROVENANCE §"Bank
# drift" was built on status being absent: a selection-only edit — approving or
# retiring an item — moved the fixture while this hash held. It no longer does.
# Retiring m14-q040 (C3) now moves bank_hash by itself, which is why the two
# beads had to re-freeze together and why the domain string is wrong until
# bd-6ycw bumps it: two different definitions are both still labelled v1.
#
# bd-6ycw / C2 remainder (2026-08-15): the tag now names the v2 definition.
# Payload keys did not change this walk — only the domain-separation label —
# so a v1 hash and a v2 hash of the same bank are not comparable. That is the
# point of the bump. Re-freeze is the bank_hash bytes + the four seed-42
# artifacts that embed them, plus this surface pin. Payload shape is unchanged.
[[surface]]
id = "bank.hash-payload"
title = "The bank_hash content address — which item fields it covers"
version = "v4c837056ec0e"
justification = "bank_hash is pinned by goldens/bank_hash.txt, embedded in the fixture and in every web pack, and compared inside grade() before a report is produced. Which keys enter this payload decides which bank edits are visible to any of them. Since C2 that set includes `status`, so the content address now covers the approved/retired selection itself — the property PROVENANCE §\"Bank drift\" was written against. deny_unknown_fields plus hash_payload_covers_every_modelled_field keep the two sides equal, so a field cannot be added to the struct and quietly sit outside the address again. RE-PINNED 2026-08-15 (bd-hardening-c-status-hzs.2 / bd-6ycw): BANK_HASH_DOMAIN moved cdcp-bank-v1 → cdcp-bank-v2 so a payload-definition change is labelled as a definition change, not as drift. The three sites (core const, content.lock canonical, cdcp_data CANONICAL) move in this commit. Frozen bank_hash bytes move because the salt moved, not because any item field set changed."
[[surface.pin]]
kind = "const"
file = "crates/cdcp_core/src/lib.rs"
symbol = "BANK_HASH_DOMAIN"
expect = ['b"cdcp-bank-v2\0"']
[[surface.pin]]
kind = "region"
file = "crates/cdcp_bank/src/lib.rs"
symbol = "compute_bank_hash"
digest = "f3bc025977b558e2173865be7ca4a7cc8a1c2e7e67e5908d7ccd156efbc3d01c"

