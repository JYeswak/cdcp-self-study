# GATE-SHRINK RATCHET (bd-engine-not-gate-ar39.1)
#
# cdcp_gate .rs line count is a ceiling that may only fall.
# Lowering ceiling_lines after an extraction is autonomous.
# RAISING ceiling_lines is weakening a gate and is ESCALATION-ONLY.
#
# DELETE THIS RATCHET (and this file, and the check) when:
#   1. ceiling_lines < 15000, AND
#   2. none of product_gate_files exist under crates/cdcp_gate/src/gates/.
# The test fails on purpose once both are true so the instrument cannot outlive its job.
#
# Count is wc -l (newline count), measured 2026-08-15.
# Bead cited 64,955 the previous evening; this pin is the live tree.

# 54308 -> 49422: EXTRACT-THEN-DELETE of export_anki.rs + diff_export_anki.rs
# (bd-substrate-rust-migration-jhd.13). Product is crates/cdcp_anki.
ceiling_lines = 49422
delete_when_lines_below = 15000
# Anti-vacuous: a scan that finds fewer than this many .rs files is an ERROR.
# 2 = src/lib.rs + src/main.rs. File count may fall during extraction.
min_rs_files = 2

product_crates = [
  "cdcp_core",
  "cdcp_grade",
  "cdcp_schedule",
  "cdcp_bank",
  "cdcp_assemble",
  "cdcp_learn",
  "cdcp_anki",
  "cdcp_cli",
  "cdcp_wasm",
  "cdcp_registry_check",
]

# Last product_gate_file (export_anki.rs) extracted 2026-08-15.
product_gate_files = []

