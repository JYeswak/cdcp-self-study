# =============================================================================
# doc-facts.toml — present-tense prose claims about code, and the probe that
# recomputes each one from the tree
# (bd-hardening-b-ledgers-gvm.3 · milestone B3 · gate: cdcp_gate doc-facts)
# =============================================================================
#
# WHY THIS FILE EXISTS
#
# `verify-doc-consistency` reads MILESTONE TABLES. It stayed exit 0 through all
# of these, each measured on 2026-08-13/14:
#
#   docs/PLAN-A-TO-Z.md  "Today `hash_payload()` omits them, so evidence changes
#                         do not change the content address."  — fixed hours
#                         earlier; the sentence was false when it was read.
#   docs/ROADMAP-WAVES.md "`bank_hash` omits load-bearing fields ... **not**
#                         `objective_ids`, citation ids, or item status."  — same.
#
# Neither sentence lives in a table. Both are PRESENT-TENSE CLAIMS ABOUT CODE
# sitting in prose, and a milestone-table parser structurally cannot see them.
#
# WHAT A ROW HERE IS
#
# A row maps a claim CLASS to the ARTIFACT that substantiates it (a test, a
# registry row, or a generated ledger) plus a PROBE that answers the question
# yes or no. A row with no resolving artifact is a schema ERROR. The claim
# lives in the prose, and the prose carries the ANSWER it is asserting, inline,
# as a marker:
#
#     ... `hash_payload()` now covers every modelled field
#     [[fact:fact-hash-payload-covers-objective-ids=yes]]
#
# The gate recomputes the probe against the tree and compares it to the polarity
# written at each marker site. When code moves and prose does not, every site
# asserting the old polarity goes RED with its own file:line and BOTH sides
# printed. That is the whole mechanism.
#
# THIS REGISTRY HOLDS NO VERDICTS ON PURPOSE. There is no `expect` field. If the
# expected answer lived here, one edit here would relicense every prose site at
# once — which is the single-cell edit the ledgers exist to stop. The verdict is
# written where the reader reads it, once per site, and every site is checked.
#
# `trigger` IS THE ANTI-OMISSION LEG. Omission, not malice, is the default
# failure: an author simply does not write a marker. So the gate walks EVERY
# markdown file it can find under the corpus root — not a list this file
# supplies — and any non-excluded file whose text contains a row's `trigger`
# must carry a marker for that row. You cannot hide a claim by leaving its file
# off a list, because there is no list.
#
# EXCLUSIONS NARROW ONE OBLIGATION ONLY. An `[[exclude]]` releases a file from
# the trigger→must-cite obligation. It NEVER releases a marker from being
# resolved and polarity-checked: a lying marker in an excluded file is still RED.
# An exclusion without a non-empty reason is a schema error, and an exclusion
# whose path matches no scanned file is an ERROR too — a dead exclusion is how a
# scan quietly loses a directory. A `path` ending in `/` is a directory prefix;
# it may not name a top-level directory, and it may not shadow anything under
# `docs/`, `README.md` or `CHARTER.md` — the gate compiles that surface in as
# un-excludable and measures it against the files the walk produced, not against
# the exclusion's spelling.
#
# HOW TO REVIEW A ROW
#   1. Run the probe by hand. Does it still ask the question `question` states?
#   2. Read every marker site (`grep -rn '[[fact:<id>' `). Does the sentence at
#      each site really assert the polarity written there?
#   3. A row whose probe drifted away from its question is worse than no row:
#      it is a green light with a citation.
#
# =============================================================================
# DECISION (bd-charter-narrative-claims-uncovered-4msa, 2026-08-15)
#
# THIS FILE IS THE ONE RECORD.
#
# CHARTER.md narrative (How-column + prose) is owned by THIS gate.
# CHARTER §5 status cells (`Applies?`) are owned by capability-maturity via
# `charter_claim`. A `[[fact:]]` marker in a reserved status cell is RED.
# No cell is checked by two gates; no present-tense code sentence is owned
# by neither (it is registered here, or named OUT OF REACH below).
#
# Rejected: extending capability-maturity with a narrative leg. That gate
# quotes a cell verbatim and never reads a sentence; duplicating
# probe+polarity there would put two machines on one document class.
#
# README SURVEY — present-tense claims about code
#
# REGISTERED (row exists; marker at the site or the site is a second
# occurrence of a claim already marked in the same file):
#   - 822 / 797 / ~19.9× pool size — fact-bank-item-count-804,
#     fact-bank-approved-count-779, fact-approved-pool-multiplier-19-5
#     (IDs are stable names; needles track the live units_index)
#   - CHECK_STEPS= / INJECTIONS= — fact-check-steps-enforced,
#     fact-injections-enforced
#   - 134 Learn units — fact-learn-unit-count-134 (root README M8 said
#     "127 units"; corrected and marked)
#   - fuzz/ is not a workspace member — fact-fuzz-is-a-workspace-member
#     (CHARTER How-cell + TESTING.md). Trigger is `fuzz/` so CHARTER is
#     obligated; the status cell stays B1's.
#
# OUT OF REACH (reason):
#   - byte-exact / dual-path / distinct engine identities — claims-lint
#     (claim-grade-byte-exact) + capability-maturity l3a
#   - not-EPI / study-signal / domain-covered / interview-ready —
#     claims-lint
#   - serve is std-only, loopback, GET/HEAD, path-traversal guarded —
#     no probe kind for "zero added dependencies" or "guarded"; semantic
#   - "7 Rust crates, 3,763 lines, 281 KB WASM" — no count probe
#   - cdcp_grade purity (no I/O, clock, randomness) — semantic
#   - source_class=original on every item — verify-bank owns the check
#   - content.lock covers bank_hash + knowledge + modules —
#     capability-maturity l7
#   - learner pack omits answers / answer-key leak —
#     selftest_reconstructed + injection-count
#   - README rigor table L1–L7 status cells — shadow of CHARTER §5; not
#     a charter_claim (wrong file). L5 How "cargo-fuzz targets present"
#     is existence, not workspace-membership (that claim is
#     CHARTER How + TESTING.md)
#   - CDCP_FILE_ORIGIN fail-closed — CHARTER + web/README narrative;
#     resolving file is origin_guard.js, which is not a
#     test / registry_row / generated_ledger. No honest artifact.kind
#   - CHARTER "enforced by learn_surface_coverage.rs" —
#     capability-maturity learn.assessed-modules-taught evidence
#   - crate role inventory / data-flow diagram — descriptive, not a
#     yes/no polarity this gate can recompute
# =============================================================================

schema_version = 1

# ── the motivating pair: bank_hash field coverage (C2) ──────────────────────
# Both instances quoted at the top of this file are this claim, in opposite
# polarities, in two documents.

[[fact]]
id = "fact-hash-payload-covers-objective-ids"
class = "bank_hash"
artifact = { kind = "test", path = "crates/cdcp_bank/src/lib.rs" }
question = "Does the body of `BankItem::hash_payload` put `objective_ids` into the hashed payload?"
probe = { kind = "symbol_body_contains", path = "crates/cdcp_bank/src/lib.rs", symbol = "hash_payload", needle = '"objective_ids".into()' }
trigger = "hash_payload"

[[fact]]
id = "fact-hash-payload-covers-status"
class = "bank_hash"
artifact = { kind = "test", path = "crates/cdcp_bank/src/lib.rs" }
question = "Does the body of `BankItem::hash_payload` put the item `status` into the hashed payload?"
probe = { kind = "symbol_body_contains", path = "crates/cdcp_bank/src/lib.rs", symbol = "hash_payload", needle = '"status".into()' }
trigger = "hash_payload"

[[fact]]
id = "fact-hash-payload-parity-test-exists"
class = "bank_hash"
artifact = { kind = "test", path = "crates/cdcp_bank/src/lib.rs" }
question = "Is a test function named `hash_payload_covers_every_modelled_field` defined in the bank crate?"
probe = { kind = "fn_defined", path = "crates/cdcp_bank/src/lib.rs", symbol = "hash_payload_covers_every_modelled_field" }
trigger = "hash_payload_covers_every_modelled_field"

[[fact]]
id = "fact-bank-item-denies-unknown-fields"
class = "bank_hash"
artifact = { kind = "test", path = "crates/cdcp_bank/src/lib.rs" }
question = "Does `BankItem` carry `#[serde(deny_unknown_fields)]`, so an unmodelled field in a bank file is a load error rather than a silent discard?"
probe = { kind = "file_contains", path = "crates/cdcp_bank/src/lib.rs", needle = "#[serde(deny_unknown_fields)]" }
trigger = "deny_unknown_fields"

# ── claims whose truth flipped or is scheduled to flip ──────────────────────
# C4 (StdRng) landed 2026-08-14: the probe is now false. Markers must read
# `=no`. C6 (min_modules discard) already flipped.

[[fact]]
id = "fact-bank-item-count-804"
class = "pool_size"
artifact = { kind = "generated_ledger", path = "web/data/units_index.json" }
question = "Does the generated units index report `bank_item_count` 822 (file-set size, retired included)?"
probe = { kind = "file_contains", path = "web/data/units_index.json", needle = '"bank_item_count": 822' }
trigger = "822 files / 797"

[[fact]]
id = "fact-bank-approved-count-779"
class = "pool_size"
artifact = { kind = "generated_ledger", path = "web/data/units_index.json" }
question = "Does the generated units index report `approved_item_count` 797?"
probe = { kind = "file_contains", path = "web/data/units_index.json", needle = '"approved_item_count": 797' }
trigger = "797 approved / 25 retired"

[[fact]]
id = "fact-learn-unit-count-134"
class = "pool_size"
artifact = { kind = "generated_ledger", path = "web/data/units_index.json" }
question = "Does the generated units index report `unit_count` 134?"
probe = { kind = "file_contains", path = "web/data/units_index.json", needle = '"unit_count": 134' }
trigger = "134 Learn units"

# Sampling claims must quote the approved pool (bd-docs-advertise-file-count-as-pool-99sw).
# 797/40 = 19.925, advertised as ~19.9×. The file set is 822 (~20.6×) and is
# not the drawable pool. A site that writes "~20× exam" without this marker
# is quoting the file set; the trigger is the approved-pool multiplier so a
# stale ~20× cannot satisfy it.

[[fact]]
id = "fact-approved-pool-multiplier-19-5"
class = "pool_size"
artifact = { kind = "generated_ledger", path = "web/data/units_index.json" }
question = "Does the generated units index report `approved_item_count` 797, i.e. the drawable pool whose exam multiplier is ~19.9× (797/40)?"
probe = { kind = "file_contains", path = "web/data/units_index.json", needle = '"approved_item_count": 797' }
trigger = "19.9× exam"

[[fact]]
id = "fact-assemble-rng-is-chacha12"
class = "prng"
artifact = { kind = "test", path = "crates/cdcp_assemble/tests/prng_c4_migration.rs" }
question = "Does `cdcp_assemble` seed its sampler from the named `ChaCha12Rng`?"
probe = { kind = "file_contains", path = "crates/cdcp_assemble/src/lib.rs", needle = "ChaCha12Rng::seed_from_u64" }
trigger = "ChaCha12Rng"

[[fact]]
id = "fact-assemble-uses-stdrng"
class = "prng"
artifact = { kind = "test", path = "crates/cdcp_assemble/tests/prng_c4_migration.rs" }
question = "Does `cdcp_assemble` still seed its sampler from `rand`'s non-portable `StdRng`?"
probe = { kind = "file_contains", path = "crates/cdcp_assemble/src/lib.rs", needle = "StdRng::seed_from_u64" }
trigger = "StdRng"

[[fact]]
id = "fact-assemble-discards-min-modules"
class = "assemble"
artifact = { kind = "test", path = "crates/cdcp_assemble/tests/status_filter.rs" }
question = "Does `cdcp_assemble` still bind the module-coverage parameter as `_min_modules` — accepted and discarded?"
probe = { kind = "file_contains", path = "crates/cdcp_assemble/src/lib.rs", needle = "_min_modules" }
trigger = "_min_modules"

# ── README-advertised receipts (already enforced by dedicated gates) ────────
# These rows do not re-count the numbers. They tie the advertised CHECK_STEPS=
# and INJECTIONS= claims to the gates that substantiate them. Deleting either
# gate file turns the claim RED here as "no resolving artifact".

[[fact]]
id = "fact-check-steps-enforced"
class = "check_steps"
artifact = { kind = "test", path = "crates/cdcp_gate/src/gates/verify_step_count.rs" }
question = "Does the verify-step-count gate define `parse_receipt`, the function that reads the CHECK_STEPS= receipt check.sh emits?"
probe = { kind = "fn_defined", path = "crates/cdcp_gate/src/gates/verify_step_count.rs", symbol = "parse_receipt" }
trigger = "CHECK_STEPS="

[[fact]]
id = "fact-injections-enforced"
class = "injections"
artifact = { kind = "test", path = "crates/cdcp_gate/src/gates/verify_injection_count.rs" }
question = "Does the verify-injection-count gate define `parse_receipt`, the function that sums INJECTIONS= receipts from the selftest suites?"
probe = { kind = "fn_defined", path = "crates/cdcp_gate/src/gates/verify_injection_count.rs", symbol = "parse_receipt" }
trigger = "INJECTIONS="

# ── the L5 workspace-membership claim ───────────────────────────────────────
# CHARTER §5 How-cell + TESTING.md: `fuzz/` sits outside the workspace, so
# nothing in check.sh, CI, or `cargo test --workspace` ever builds those
# targets. Trigger is `fuzz/` (not `cargo fuzz`) so CHARTER is obligated.
# The L5 *status* cell stays capability-maturity's.

[[fact]]
id = "fact-fuzz-is-a-workspace-member"
class = "workspace"
artifact = { kind = "registry_row", path = "registries/capability-maturity.toml" }
question = "Is the `fuzz` package a member of the Cargo workspace, so that a workspace-wide build or test reaches it?"
probe = { kind = "toml_array_contains", path = "Cargo.toml", key = "workspace.members", value = "fuzz" }
trigger = "fuzz/"

# ── removed seed-42 export-web short-circuit (bd-smvb) ───────────────────────
# Until 2026-08-14 export-web preferred goldens/fixtures/mock40_seed42.json at
# seed 42 whenever that path existed. Restoring `seed == 42` inside
# `export_web` turns every =no site RED. The GradeExact digest pin is a
# different contract and is not this row.

[[fact]]
id = "fact-export-web-implicit-fixture-at-seed-42"
class = "assemble"
artifact = { kind = "test", path = "crates/cdcp_cli/tests/cli.rs" }
question = "Does `export_web` still contain an implicit `seed == 42` fixture preference (the short-circuit bd-golden-sampler-divergence-09q deleted)?"
probe = { kind = "symbol_body_contains", path = "crates/cdcp_cli/src/main.rs", symbol = "export_web", needle = "seed == 42" }
trigger = "implicit fixture"

# ── exclusions (trigger→must-cite only; markers are still checked) ──────────

[[exclude]]
path = "course-engine/beads_compliance_audit/"
reason = "Dated audit snapshots, not live law. Every file under this prefix is a pass record (passes/<UTC>/) or a rollup of one; sentences are past-tense by construction (Date/Pass headers, or quoted bead text from that date). New passes land continuously, so an exact-path list or an as-of-stamp walk would break the build on unrelated work. This prefix is therefore permanent — not a parked bead. COST: a genuinely present-tense claim about code written into this directory is invisible to this gate. Write live claims in docs/ (un-excludable) with a [[fact:]] marker; do not write them here."
