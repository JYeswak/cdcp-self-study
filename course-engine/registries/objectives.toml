# =============================================================================
# objectives.toml — learning objectives linked to claim lattice (L1)
# =============================================================================
# Lightweight map: product outcomes → registered claim ids.
# Empty objectives array = ERROR (never vacuous green).
# =============================================================================

schema_version = 1

[registry]
name = "objectives"
description = "Learner-facing objectives that may only cite registered claims"

[[objective]]
id = "obj-honesty-not-credential"
text = "Learner understands mock results are not EPI/EXIN certification"
claim_ids = ["claim-not-epi-certified", "claim-study-signal-27"]

[[objective]]
id = "obj-interview-fluency"
text = "Buyer outcome: interview-ready data-centre fluency (study signal)"
claim_ids = ["claim-interview-ready", "claim-study-signal-27"]

[[objective]]
id = "obj-domain-map"
text = "Public 14-domain syllabus coverage with standards family crosswalk"
claim_ids = ["claim-domain-covered", "claim-syllabus-mapped", "claim-standards-family-mapped"]

[[objective]]
id = "obj-grade-integrity"
text = "Deterministic grade path with byte-exact goldens"
claim_ids = ["claim-grade-byte-exact"]

[[objective]]
id = "obj-clean-bank"
text = "Original items only; no dump provenance; licensed standards quotes only"
claim_ids = ["claim-forbidden-dump-bank", "claim-forbidden-iec-clause-without-license"]

[[objective]]
id = "obj-m12-liion-855"
text = "Learner names NFPA 855 and UL 9540A, and can distinguish a Li-ion UPS-room playbook from a BESS-yard playbook (off-gas, deflagration, water-on-Li-ion, LSFT) without inventing agent-mass or fire percentages"
claim_ids = ["claim-domain-covered", "claim-interview-ready"]

[[objective]]
id = "obj-m08-liquid-ready-cabinet"
text = "Learner can name a liquid-ready / GPU-hall cabinet as a distinct SKU (800 mm hose/manifold volume, RDHx door, drip pans, CDU landing, immersion tank, 40–100 kW structure) and point at Module 09 for liquid families"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m14-cdu-loop-leak"
text = "Learner lists CDU / secondary-loop leak plus flow / temperature / pressure as first-class points, and pages on seconds-scale inlet or cold-plate rate-of-rise — a hall rope and a 15-minute average are the wrong coverage and the wrong clock"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m01-cause-framing-2026"
text = "Learner frames facility unavailability as power-path led (UPS / ATS / generator), cooling as cascade (Modules 09 / 10), and human/process as contributing (Module 15 contributor-vs-root and unverifiable-majority refusal) — not three peer root-cause buckets, and not an invented outage percentage"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m01-2026-site-types"
text = "Learner names neocloud / GPU colo / AI factory / behind-the-meter generation campus and how each differs from retail/wholesale colo, while keeping the six classic types as the 2018–2020 baseline"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m01-nines-scope"
text = "Learner drills nines measurement scope: per service vs per site vs per component, planned vs unplanned, whose clock; recites the 8.8 h / 52.6 min / 5.3 min table and demotes the 9 h / 1 h slogan"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m01-ai-density-ridethrough"
text = "Learner states that at 40–100 kW, UPS without cooling collapses thermal ride-through from minutes to seconds (load variability, operating near power limits) and points at Module 09 rather than teaching the cooling plant"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m01-org-split"
text = "Learner names who typically owns facilities vs IT vs finance vs TPM, how an org-split outage starts (two green objects, no owner of the path), and points at Module 15 for the 2.1 organizational-structure heading"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m03-interconnect-queue"
text = "Learner treats the interconnect queue (position, studies, financial security, years-not-weeks) as the 2026 go/no-go for whether a hall ever energizes; dual-feed lead times still matter and do not replace the queue"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m03-btm-campus"
text = "Learner names a behind-the-meter / on-site generation campus as a site type and a walk-away reason, points at Module 01 for the type noun and Module 06 for the power path, and does not steal UPS/ATS/generator internals"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m03-aifactory-site-criteria"
text = "Learner can speak AI-factory / neocloud site criteria as power + water rights + fiber + queue, not a brochure type list"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m04-floor-types"
text = "Learner distinguishes stringered vs free-standing/stringerless understructure and wood-core vs cementitious panels as the two main raised-floor type axes, and treats a vendor load row as example-not-code rather than a 250 psf statute"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m02-availability-class"
text = "Learner holds Rated ≠ Tier ≠ Availability Class: Availability Class 1–4 lives in EN 50600 / ISO/IEC 22237, used alongside TIA, never Class 3 = Rated-3 = Tier III"
claim_ids = ["claim-interview-ready", "claim-standards-family-mapped"]

[[objective]]
id = "obj-m02-en-50600"
text = "Learner names EN 50600 as the European facilities series, first-class twin of ISO/IEC 22237, carrying Availability Class and separate Protection Classes"
claim_ids = ["claim-interview-ready", "claim-standards-family-mapped"]

[[objective]]
id = "obj-m02-three-plaques"
text = "Learner names the three Uptime plaques — TCCD (design documents), TCCF (constructed facility), TCOS (operational sustainability) — and will not accept a single sticker as the whole claim"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m02-tia-942-c"
text = "Learner pins ANSI/TIA-942-C (2024) and the Rated-not-Tier rename, and treats an un-yeared “per TIA-942” as soft"
claim_ids = ["claim-interview-ready", "claim-standards-family-mapped"]

[[objective]]
id = "obj-m02-kill-99982"
text = "Learner name-and-kills 99.982% = Tier III (and the withdrawn I–IV downtime table) and will not replace it with a new percentage: Tier is topology, not a nine"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

[[objective]]
id = "obj-m11-gpu-fabric-availability"
text = "Learner treats GPU-cluster east-west fabric (InfiniBand / RoCE, 400/800G) as an availability path equal to power: one fabric cut is one training job; interconnect in this module still means fewer patch points"
claim_ids = ["claim-interview-ready", "claim-domain-covered"]

