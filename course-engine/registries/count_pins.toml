# Source-derived count observations.
#
# The expected value is a checked-in observation, not a source of truth.  The
# count-pin-drift gate recomputes every row from the named source and reports
# DRIFT (expected vs actual) before downstream suites assert on these values.
# A correct source count can still be wrong from the first commit; this guard
# detects movement, not an initially bad observation.
schema_version = 1

[[derived]]
id = "bank.file-count"
source = "bank/items"
metric = "file_count"
expected = 957
reason = "The manifest and bank verifier measure the complete TOML file set, including retired content."

[[derived]]
id = "bank.approved-count"
source = "bank/items"
metric = "status_count"
status = "approved"
expected = 931
reason = "The learner pool and approved-only exports must agree on the status-qualified source pool."

[[derived]]
id = "bank.retired-count"
source = "bank/items"
metric = "status_count"
status = "retired"
expected = 26
reason = "Retired files remain in the source tree and must not silently disappear from lifecycle accounting."

