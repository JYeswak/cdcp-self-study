# ─────────────────────────────────────────────────────────────────────────────
# THE VERDICT-SHAPE LEG (bd-j8b2), relocated from the harnesses onto the GATES.
#
# bd-j8b2 proposed a meta-gate asserting that every diff_*.rs CARRIES a leg
# checking "no success token on a path that exited non-zero", and recorded that
# only 3 of 11 did. That design has two problems this file avoids. It is a
# source scan for the presence of a string, which is the shape bd-0czh already
# measured being fooled — three fail-opens survived an audit because grepping
# for the message returned a hit and READ AS GUARDED. And it needed eight
# sibling-owned test files edited in one wave.
#
# The leg is per-CASE and unbounded; the DEFECT is per-GATE and there are
# nineteen gates. So the check runs against the gate BINARY: for every gate the
# dispatcher lists, on both a live root and an empty root, exit == 0 must be
# equivalent to "stdout carries this gate's success token". That is the same
# claim, proven by execution rather than by grep, over the whole roster at once,
# and it needs no edit to any file another agent owns.
#
# The token differs per gate — PASS, `ok:`, a prefixed spelling — which is
# exactly why it is a registry row and not a literal in a scanner.
# ─────────────────────────────────────────────────────────────────────────────

[probe]
# Anti-vacuous on the probe itself: if no gate is ever observed GREEN carrying
# its token, the token side of the equivalence was never exercised and a
# "no token on failure" check passes for free.
green_with_token_floor = 1
# The known token vocabulary, used to prove that a gate registered as
# token-free really prints nothing that reads as a verdict.
token_vocabulary = ["PASS", "GREEN", ": ok:", ": OK:"]

[[harness]]
file = "diff_smoke_a11y.rs"
gate = "smoke-a11y"
comparators = ["cmp", "compare_crash"]
# bd-substrate-rust-migration-jhd.19. The 19 adversarial HTML rows are the
