# items key the strictly-longest option. Rank-uniformity checks BOTH tails, so
# neither 100% nor 0% can pass.

[[gate]]
name = "required-tests"
success_token = "required-tests: PASS"
live_probe = true
# No oracle. Asserts every load-bearing test named in registries/required_tests.toml
# appears as `test <name> ... ok` and that every suite reports `0 filtered out`.
# Exists because `cargo test -p cdcp_gate answer_key_skew` once reported
# "ok. 0 passed; 232 filtered out" — zero tests run, reported as a pass.

[[gate]]
name = "emit-tick"
success_token = "emit-tick: PASS"
live_probe = false
live_probe_skip_reason = "appends a row to .flywheel/tick-ledger.jsonl; a probe must never mutate a tracked artifact"
green_unprobed_reason = "Observed GREEN in production use, not by probe: T10 (commit 75e78e8, product_moved computed true from bank/items) and T11 (e05c172). Both rows are in .flywheel/tick-ledger.jsonl. An automated GREEN probe would have to append a real row, so the green side is evidenced by the ledger rather than by the harness."
# No oracle. Computes product_moved from the commit diff against the CHARTER's
# product_paths rather than accepting the caller's claim, and records a
# claimed-vs-computed disagreement rather than silently overriding it.
