schema_version = 1

# ─────────────────────────────────────────────────────────────────────────────
# THE BLIND SPOT, MEASURED.  (bd-differential-shared-blindspot-4qje, bd-j8b2)
#
# A differential harness asserts that two implementations AGREE. Agreement is a
# NECESSARY condition for a correct port and is NOT a SUFFICIENT condition for a
# correct gate: a defect present in BOTH sides agrees with itself. Every case
# that asserts only agreement is silent about whether the shared behaviour is
# right.
#
# That is not theoretical. Measured 2026-08-14 in verify_objectives:
#
#     PASS ... primary_topics=106 covered=106 shortfalls=0 min_per_topic=0
#              mode=strict ... EXIT 0
#
# 106 of 106 topics "covered", in STRICT mode, with not one comparison
# performed — `--min-items-per-topic 0` fell straight through the comparison
# guard. diff_verify_objectives.rs had been running that exact case
# (`m min topic 0`) and PASSING it for weeks, because both sides produced the
# same wrong answer. The harness header already said "a defect faithfully
# ported is still a defect", and the defect landed in its own blind spot.
#
# This file is the census of that blind spot and the ratchet that stops it
# growing. It is re-derived from the harness sources on every run by
# crates/cdcp_gate/tests/differential_verdict_census.rs — the numbers below are
# a BUDGET, not a record; the measurement is what the test does.
#
# SECOND USE: THE RETIREMENT COST SHEET. The standing policy is to retire an
# oracle at port time — change the Rust, delete the .py, convert its
# differential cases into direct tests that assert the VERDICT. `agreement_only`
# is exactly the number of cases that EVAPORATE under that conversion, because a
# case saying only "the two sides agree" says nothing at all once there is only
# one side.
#
# RETIREMENT HAS TWO INDEPENDENT BLOCKERS, and this file supplies the second.
#
#   A. IS THE ORACLE STILL INVOKED? If check.sh still runs it, it cannot be
#      retired at any price until the invocation is repointed.
#   B. WHAT DOES RETIRING COST? = `agreement_only`.
#
# BLOCKER A, MEASURED TRANSITIVELY 2026-08-14 — and `grep python3 check.sh` DOES
# NOT ANSWER IT. check.sh calls other shell scripts, and those invoke the
# oracles; two more hide behind a variable (`python3 "$CHECKER"`) that no grep
# for a .py filename can see. Resolved by following check.sh's own
# `run_selftest`/`sh scripts/*.sh` calls into each script:
#
#   oracle                      invoked?  via
#   verify_orphans.py           RETIRED   Rust unit/selftest owns the gate
#   verify_objectives.py        YES (6)   check.sh:714  -> selftest_l7_objectives.sh
#   verify_coverage.py          YES (3)   check.sh:683  -> selftest_l6_coverage.sh
#   verify_bank.py              YES (2)   check.sh:719  -> smoke_slo.sh
#   verify_doc_consistency.py   YES (1)   check.sh:767  -> selftest_doc_consistency.sh, as $CHECKER
#   verify_injection_count.py   YES (1)   check.sh:802  -> selftest_injection_count.sh, as $CHECKER
#   validate_grounding.py       RETIRED   Rust unit suite owns the gate
#   verify_content_lock.py      no        not referenced by any script
#   verify_knowledge_paths.py   RETIRED   file deleted (jhd.33); rust is CI
#   build_glossary_json.py      RETIRED   file deleted; no surviving invocation
#   build_units.py              RETIRED   file deleted; no surviving invocation
#
# READING THE TWO TOGETHER — verify_content_lock.py and
# verify_knowledge_paths.py are RETIRED (never invoked; rust is CI).
# verify_orphans.py and validate_grounding.py are now retired: their Rust unit
# suites own the wired known-bad legs. verify_bank.py remains blocked on
# invocation; everything else is blocked on both invocation and its
# differential consumer.
# ─────────────────────────────────────────────────────────────────────────────

[census]
measured_on = "2026-08-14"
methodology = """
A CASE is one invocation, from inside a #[test] fn, of the harness's own
byte-comparison helper (the function that runs both implementations and asserts
stdout/stderr/exit-code equality). That is the unit the harnesses already count
in their own COMPARED counters.

A case carries an INDEPENDENT VERDICT if, at that call site, the harness also
asserts something about WHAT the shared output is — the exit code, or a
required substring of stdout/stderr — i.e. a claim that would still be
checkable if only ONE implementation existed. A case that binds the comparison
result and never asserts on it counts as agreement-only, same as a bare call.

Otherwise the case is AGREEMENT-ONLY, and it is blind by construction: no
defect that both implementations share can make it fail, and nothing at all
survives when its oracle is retired.
"""

# Anti-vacuous floors, derived from what the tree contained when this file was
# written. A census that discovers nothing must be an ERROR, never a pass.
registered_harness_floor = 11   # rows below; monotone — rows stay after retirement
active_harness_floor = 1        # diff_*.rs files still holding comparator calls

# THE RATCHET. The total number of agreement-only cases across the tree may
# fall and may never rise. Enforcement is on the TOTAL, deliberately, and not
# per harness: four of these files were owned by other agents mid-wave, and a
# gate that goes red on a file its owner may not touch gets disabled — and a
# disabled detector is worth less than none, because it also carries the belief
# that the class is covered. Per-harness numbers below are reported every run,
# and are the input to the retirement decision; the total is what is enforced.
#
# 36 when first measured. 28 after diff_verify_orphans.rs was converted in the
# same wave (7 to 0) and diff_build_units.rs was converted by its owner (1 to
# 0). 18 after bd-diff-coverage-agreement-only-25ux converted
# diff_verify_coverage.rs (9 to 0). 5 after
# bd-diff-remaining-agreement-only-qgy9 converted objectives (10 to 0),
# grounding (2 to 0) and doc-consistency (1 to 0). 0 after
# bd-engine-not-gate-ar39.8 converted the last 5 injection_count
# shape/spelling call sites. Set to the MEASURED value, not a value with
# headroom: a ratchet with slack is not a ratchet.
#
# IF THIS FIRED ON YOUR FILE: the fix is to give your new case an independent
# verdict, not to raise this number. Raising it is a gate bypass and is
# escalation-only. Lowering it after a conversion is expected and autonomous.
agreement_only_total_budget = 0

# EXIT-ONLY AXIS (bd-diff-exit-code-only-verdicts-t6kv, measured 2026-08-15).
