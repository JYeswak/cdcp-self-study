# ─────────────────────────────────────────────────────────────────────────────
# THE VERDICT-SHAPE LEG (bd-j8b2) — TWO CHECKS, NOT A RELOCATION.
#
# LEG D (kept): the gate BINARY, on empty and (where safe) live roots, must
# have exit == 0 equivalent to "stdout opens a line with this gate's success
# token". That covers gates that never had a harness.
#
# LEG I (the mechanism this bead named): a META-GATE over the harnesses. Every
# active crates/cdcp_gate/tests/diff_*.rs must CARRY a per-side
# "nonzero ⇒ no registered success token" check in each core comparator, or
# declare a skip with a reason. The detector is structural (the comparator
# applies the check to both sides) and the token is THIS FILE's [[gate]] row,
# never a scanner keyed on the literal PASS. A comment containing a helper
# name cannot satisfy it. An empty enumeration is an ERROR. A skip without a
# reason is a schema error.
#
# The eight-file instance-patch is still rejected. Harnesses that were never
# one of the three measured instances (lt7 / qm65 / rk9n) declare a skip;
# installing the helper there is the fourth-patch shape this bead forbids.
# The class of unregistered missing legs is closed at zero.
#
# The token differs per gate — PASS, `ok:`, a prefixed spelling — which is
# exactly why it is a registry row and not a literal in a scanner.
# ─────────────────────────────────────────────────────────────────────────────

[verdict_shape]
# Anti-vacuous: at least one live harness must be observed CARRYING the
# per-side leg, or every missing leg being declared is a vacuous pass.
carrying_floor = 1

[probe]
# Anti-vacuous on the probe itself: if no gate is ever observed GREEN carrying
# its token, the token side of the equivalence was never exercised and a
# "no token on failure" check passes for free.
green_with_token_floor = 1
# The known token vocabulary, used to prove that a gate registered as
# token-free really prints nothing that reads as a verdict.
token_vocabulary = ["PASS", "GREEN", ": ok:", ": OK:"]

