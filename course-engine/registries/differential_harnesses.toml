# ── bd-substrate-rust-migration-jhd.14 (wave 4, M8-C diagram smoke) ──────────
#
# Written to the post-blind-spot standard: every call site binds the
# comparator's result and asserts BOTH the exit code and a required substring of
# stdout, so the harness contributes ZERO to the ratchet and loses nothing on
# the day `scripts/smoke_diagrams.py` is retired.
#
# TWO COMPARATORS, and the second is not a variant spelling. `compare_with`
# takes a mutation closure that runs against each freshly materialised copy, for
# the one case a byte map cannot express: a diagram file chmod-ed 000, which is
# the only input that reaches the oracle's `OSError` arm. It is registered so
# that case is CENSUSED rather than invisible.
#
# This harness runs its two copies SEQUENTIALLY AT ONE PATH (materialise, run,
# wipe, re-materialise, run) instead of side by side in `py/` and `rs/`. Five of
# this gate's messages print an absolute path, so side-by-side copies differ in
# exactly those bytes and the tuple could only be compared after normalising the
# path away — which would also mask a port that printed the WRONG path.

[[harness]]
file = "diff_smoke_diagrams.rs"
gate = "smoke-diagrams"
comparators = ["compare_four_tuple", "compare_with"]
cases = 13
agreement_only = 0

[[gate]]
name = "smoke-diagrams"
success_token = "smoke_diagrams: PASS"
