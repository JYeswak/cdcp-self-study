# bd-0cjy: grounding-wave stem regressions. Thresholds and lexical markers are
# policy rows so calibration is visible and cannot hide in Rust literals.

[[detector]]
name = "template-stem"
# A template finding needs both signals: high stem similarity and low
# divergence in the correct-answer text. A two-item collapsed-answer pair is
# the smallest meaningful cluster, so one matching peer is sufficient.
similarity_pct = 70
answer_similarity_pct = 60
min_peers = 1

[[detector]]
name = "recall-only-stem"
required_tokens = ["explicitly"]
question_tokens = ["which", "what"]
action_tokens = ["listed", "stated", "named", "includes", "included"]
document_tokens = [
  "abstract",
  "catalog",
  "document",
  "iec",
  "iso",
  "nfpa",
  "preview",
  "public",
  "rfc",
  "scope",
  "source",
  "standard",
]

# There are currently no adjudicated exceptions. The containment family is
# excluded by the answer-text divergence signal, not by a per-id waiver.
