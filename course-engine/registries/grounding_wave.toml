# bd-0cjy: grounding-wave stem regressions. Thresholds and lexical markers are
# policy rows so calibration is visible and cannot hide in Rust literals.

[[detector]]
name = "template-stem"
similarity_pct = 70
min_peers = 2

[[detector]]
name = "recall-only-stem"
required_tokens = ["explicitly"]
question_tokens = ["which", "what"]
action_tokens = ["listed", "stated", "named", "includes", "included"]
document_tokens = [
  "abstract",
  "catalog",
  "document",
  "iec",
  "iso",
  "nfpa",
  "preview",
  "public",
  "rfc",
  "scope",
  "source",
  "standard",
]

# Per-id, per-detector adjudications. Every row requires a reason, and the
# detector errors if the named finding disappears (a stale exception is not
# permission for a future defect).
[[exclude]]
id = "m09-q207"
detector = "template-stem"
reason = "Byte-identical to 955a8f1 in stem, choices, key, and explanation; it is a sound member of the intentional hot/cold containment teaching family with m09-q149 and m09-q206."
