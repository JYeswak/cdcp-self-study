# =============================================================================
# substrate_allowlist.toml — the non-Rust exemption register (S0)
# =============================================================================
# Enforced by `cdcp_gate substrate-guard` (crates/cdcp_gate/src/gates/substrate_guard.rs)
# from scripts/check.sh, and — for the ONE commit path git runs a hook on — from
# hooks/pre-commit.
#
# WHAT THE GATE ENFORCES (floor-raise, nothing more): an entry git tracks
# ANYWHERE under the engine root that the gate identifies as non-Rust source
# must appear here with a non-empty `reason`, a `migration_bead`, and an
# `expires` date that has not passed. Four identification shapes: a scanned
# extension (case-insensitive), a shebang on a file the extension rule cannot
# classify, a tracked symlink, and a submodule gitlink. Blank is never
# permissive — a missing or empty field is a schema ERROR, not permission.
#
# WHAT IT CANNOT DO: decide whether a `reason` is honest English, whether a
# `migration_bead` names real work, or whether an `expires` was picked to be far
# away. One mechanical exception (bd-allowlist-stale-load-bearing-seq9, extended
# bd-retire-oracle-on-behaviour-change-gna0): a reason that claims this path is
# still the live oracle ("load-bearing check.sh", "check.sh invokes",
# "check.sh hard-fails if", "byte-exact oracle", "oracle required") is checked
# against the invocation set derived from scripts/check.sh. Presence tests
# (`[ -f path ]`) are reported as presence, distinct from invoke; a reason
# claiming "not on the check.sh path" / "not a check.sh step" is RED if the
# walk reaches the file by invoke OR presence. Comments are not either.
# The rest of the sentence is still review's job. The gate also cannot decide
# that a .rs file is not shelling out to python3 — this is a path-and-shebang
# policy, not a statement about what runs.
#
# WHERE IT IS ENFORCED (bd-xmn5 / bd-efm7, measured 2026-08-14 on git 2.53.0):
# the pre-commit hook fires for `git commit` and for nothing else. Merge,
# cherry-pick, rebase, `git am`, `git commit-tree` and `--no-verify` all created
# commits carrying an unlisted .py with the hook never invoked, and a fresh
# clone has no hook at all. The floor is the PRESENCE scan in check.sh (and
# the cargo-test live-tree test): an unlisted .py cannot go green even if the
# hook never ran. The hook is a courtesy (`cdcp_gate install-hooks`). There is
# no required GitHub check and no pre-receive hook (written decision, bd-efm7).
# bd-m67m: check.sh runs install-hooks so CI is not a clone without a hook.
#
# THIS FILE IS THE MIGRATION WORKLIST. Every row is a debt. The row count is the
# progress metric for epic bd-substrate-rust-migration-jhd and its target is 0.
# Porting a script to Rust means DELETING its row; a row whose file is gone is
# itself an error.
#
# Measured 2026-08-15 (bd-allowlist-stale-load-bearing-seq9, updated jhd.13):
# export_anki.py is DELETED (product is `cdcp export-anki` / cdcp_anki).
# smoke_learn_v2.py retired with bd-substrate-rust-migration-jhd.20.
# Ported verify_*.py / validate_*.py rows that remain are listed in
# [oracle_inventory]. A reason that claims "load-bearing check.sh" /
# "byte-exact oracle" / "oracle required" for a path check.sh does not
# invoke is RED. A "not on the check.sh path" claim for a path the walk
# reaches (invoke or -f presence) is also RED.
#
# ORACLE RETIREMENT (bd-retire-oracle-on-behaviour-change-gna0) — THE POLICY,
# IN THIS FILE ONLY. After a port, "Python first" is the wrong rule. The
# oracle's job is to prove the port FAITHFUL and that job completes at port
# time. A deliberate behaviour change lands in the Rust gate only.
# Implementing it twice — once in a .py that check.sh does not run — is the
# migration tool becoming a maintenance tax.
#
# RETIRE (delete the .py + its allowlist row + its check.sh presence lock +
# convert or delete its diff_*.rs) only when ALL of these hold:
#   1. check.sh does not invoke the .py (seq9: presence tests and comments
#      are not invokes). A nested selftest that still runs it is a blocker.
#   2. The Rust command is what check.sh / CI runs.
#   3. A known-bad Rust test replaces the differential.
# A weaker claim (the two sides agree) may not justify retiring a stronger
# one (the Rust verdict is what the correct answer IS).
#
# [oracle_inventory] is the remaining scripts/{verify,validate,smoke}_*.py
# table. An empty scan of those names is an ERROR while the table exists.
# EXTRACT-THEN-DELETE already took every smoke_*.py. 2026-08-15 also retired
# verify_content_lock.py (never invoked, rust is CI, known-bad rust tests
# replace the differential). verify_knowledge_paths.py stays: its harness
# is the plant target for bd-census-mutation-pair-unproven-pi0v.
# =============================================================================

schema_version = 1

[scan]
# The gate compiles in a floor. This section may WIDEN that floor; narrowing it
# is an ERROR, so the gate cannot be switched off by a one-word edit here.
#
# SCOPE, since bd-xmn5 (2026-08-14): the scanned surface is the WHOLE ENGINE
# TREE, not these roots. `roots` is retained as a floor-checked MINIMUM — if
# whole-tree scanning is ever narrowed, scripts/ and crates/ still cannot be
# dropped in the same edit. Measured before the change: docs/payload.py was
# exit 0, and four real shell files (.flywheel x2, tests/ x2 — two of them
# invoked as gates by check.sh) had never been inside the floor at all.
#
# EXTENSIONS are matched CASE-INSENSITIVELY (scripts/payload.PY was exit 0) and
# cover the shell, python, and check.sh-invoked node family, not two spellings
# (scripts/payload.bash was exit 0). `mjs` is IN the floor (bd-yp9x, 2026-08-15):
# the four `scripts/*.mjs` check.sh runs, plus two tracked node helpers on that
# path, are the same class as the remaining `.py`. `js` STAYS OUT: web/assets/js
# is the learner product surface (wasm dual-path, not a cdcp_gate port).
# COST (permanent, same form as the plzm beads_compliance_audit/ exclusion): an
# unreasoned `.js` can be committed and this gate is silent. Adding `js` here
# without any tracked `.js` is ERROR (empty scan).
roots = ["scripts", "crates"]
extensions = ["py", "pyw", "sh", "bash", "zsh", "ksh", "mjs"]
include_engine_root_files = true

[wiring]
# check_sh is PINNED to "scripts/check.sh" in the gate; any other value is a
# schema ERROR — pointing it at a decoy file used to satisfy the wiring leg.
# status is a RATCHET: once a commit says "wired", a later commit saying
# "pending" is RED, not an edit.
# NEVER add a row for scripts/__cdcp_probe_unlisted__.py — that is the plant
# --prove-wired uses, and listing it makes the probe vacuous (the gate ERRORs).
# BUILT != WIRED. `status = "pending"` means the check.sh step has not landed
# yet: the gate reports the gap on stderr but does not fail, so the very commit
# that wires it is not blocked by its own absence. Once the orchestrator adds the
# step, flip this to "wired" in the same commit — from then on, deleting the step
# is RED. Empty or unknown status is a schema ERROR.
status = "wired"
check_sh = "scripts/check.sh"
invocation = "run_cdcp_gate substrate-guard || fail \"substrate guard\""
bead = "bd-substrate-rust-migration-jhd.1"

# Remaining scripts/{verify,validate,smoke}_*.py after EXTRACT-THEN-DELETE.
# Compiled-in scan: non-recursive scripts/ names with those prefixes.
# Empty discovery is ERROR. A row whose file is gone is ERROR. An unlisted
# remaining oracle is ERROR. Delete this whole table with the last file.
