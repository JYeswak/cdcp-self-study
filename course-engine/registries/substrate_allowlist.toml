# =============================================================================
# substrate_allowlist.toml — the non-Rust exemption register (S0)
# =============================================================================
# Enforced by `cdcp_gate substrate-guard` (crates/cdcp_gate/src/gates/substrate_guard.rs)
# from scripts/check.sh, and — for the ONE commit path git runs a hook on — from
# hooks/pre-commit.
#
# WHAT THE GATE ENFORCES (floor-raise, nothing more): an entry git tracks
# ANYWHERE under the engine root that the gate identifies as non-Rust source
# must appear here with a non-empty `reason`, a `migration_bead`, and an
# `expires` date that has not passed. Four identification shapes: a scanned
# extension (case-insensitive), a shebang on a file the extension rule cannot
# classify, a tracked symlink, and a submodule gitlink. Blank is never
# permissive — a missing or empty field is a schema ERROR, not permission.
#
# WHAT IT CANNOT DO: decide whether a `reason` is honest, whether a
# `migration_bead` names real work, or whether an `expires` was picked to be far
# away. Those are review's job. The gate only makes the exemption exist, be
# dated, be attributed, and show up in a diff. It also cannot decide that a .rs
# file is not shelling out to python3 — this is a path-and-shebang policy, not a
# statement about what runs.
#
# WHERE IT IS ENFORCED (bd-xmn5, measured 2026-08-14 on git 2.53.0): the
# pre-commit hook fires for `git commit` and for nothing else. Merge,
# cherry-pick, rebase, `git am`, `git commit-tree` and `--no-verify` all created
# commits carrying an unlisted .py with the hook never invoked, and a fresh
# clone has no hook at all. What actually holds is the PRESENCE scan in
# check.sh, one build later. See bd-efm7 for the missing server-side boundary
# and bd-m67m for the hook that CI never installs.
#
# THIS FILE IS THE MIGRATION WORKLIST. Every row is a debt. The row count is the
# progress metric for epic bd-substrate-rust-migration-jhd and its target is 0.
# Porting a script to Rust means DELETING its row; a row whose file is gone is
# itself an error.
#
# Measured 2026-08-14: 3,763 lines of Rust against 6,624 Python and 2,155 shell,
# with 17 Python scripts wired into check.sh as load-bearing gates — three of
# them added the day after the Rust pattern was written down. Doctrine did not
# stop it. Rows below are grandfathered EXPLICITLY and visibly; none of them
# arrived silently, and none of them can stay past its date without someone
# re-affirming it in a reviewable diff.
# =============================================================================

schema_version = 1

[scan]
# The gate compiles in a floor. This section may WIDEN that floor; narrowing it
# is an ERROR, so the gate cannot be switched off by a one-word edit here.
#
# SCOPE, since bd-xmn5 (2026-08-14): the scanned surface is the WHOLE ENGINE
# TREE, not these roots. `roots` is retained as a floor-checked MINIMUM — if
# whole-tree scanning is ever narrowed, scripts/ and crates/ still cannot be
# dropped in the same edit. Measured before the change: docs/payload.py was
# exit 0, and four real shell files (.flywheel x2, tests/ x2 — two of them
# invoked as gates by check.sh) had never been inside the floor at all.
#
# EXTENSIONS are matched CASE-INSENSITIVELY (scripts/payload.PY was exit 0) and
# cover the shell and python family, not two spellings (scripts/payload.bash was
# exit 0). `js`/`mjs` are deliberately NOT here — see bd-yp9x.
roots = ["scripts", "crates"]
extensions = ["py", "pyw", "sh", "bash", "zsh", "ksh"]
include_engine_root_files = true

[wiring]
# check_sh is PINNED to "scripts/check.sh" in the gate; any other value is a
# schema ERROR — pointing it at a decoy file used to satisfy the wiring leg.
# status is a RATCHET: once a commit says "wired", a later commit saying
# "pending" is RED, not an edit.
# NEVER add a row for scripts/__cdcp_probe_unlisted__.py — that is the plant
# --prove-wired uses, and listing it makes the probe vacuous (the gate ERRORs).
# BUILT != WIRED. `status = "pending"` means the check.sh step has not landed
# yet: the gate reports the gap on stderr but does not fail, so the very commit
# that wires it is not blocked by its own absence. Once the orchestrator adds the
# step, flip this to "wired" in the same commit — from then on, deleting the step
# is RED. Empty or unknown status is a schema ERROR.
status = "wired"
check_sh = "scripts/check.sh"
invocation = "cargo run -q -p cdcp_gate -- substrate-guard || fail \"substrate guard\""
bead = "bd-substrate-rust-migration-jhd.1"

