# =============================================================================
# substrate_allowlist.toml — the non-Rust exemption register (S0)
# =============================================================================
# Enforced by `cdcp_gate substrate-guard` (crates/cdcp_gate/src/gates/substrate_guard.rs)
# from scripts/check.sh and from the pre-commit hook.
#
# WHAT THE GATE ENFORCES (floor-raise, nothing more): a `.py` or `.sh` file
# tracked or staged under scripts/, crates/, or the engine root must appear here
# with a non-empty `reason`, a `migration_bead`, and an `expires` date that has
# not passed. Blank is never permissive — a missing or empty field is a schema
# ERROR, not permission.
#
# WHAT IT CANNOT DO: decide whether a `reason` is honest, whether a
# `migration_bead` names real work, or whether an `expires` was picked to be far
# away. Those are review's job. The gate only makes the exemption exist, be
# dated, be attributed, and show up in a diff.
#
# THIS FILE IS THE MIGRATION WORKLIST. Every row is a debt. The row count is the
# progress metric for epic bd-substrate-rust-migration-jhd and its target is 0.
# Porting a script to Rust means DELETING its row; a row whose file is gone is
# itself an error.
#
# Measured 2026-08-14: 3,763 lines of Rust against 6,624 Python and 2,155 shell,
# with 17 Python scripts wired into check.sh as load-bearing gates — three of
# them added the day after the Rust pattern was written down. Doctrine did not
# stop it. Rows below are grandfathered EXPLICITLY and visibly; none of them
# arrived silently, and none of them can stay past its date without someone
# re-affirming it in a reviewable diff.
# =============================================================================

schema_version = 1

[scan]
# The gate compiles in a floor (roots scripts+crates, extensions py+sh, engine
# root files ON). This section may WIDEN that floor; narrowing it is an ERROR,
# so the gate cannot be switched off by a one-word edit here.
roots = ["scripts", "crates"]
extensions = ["py", "sh"]
include_engine_root_files = true

[wiring]
# check_sh is PINNED to "scripts/check.sh" in the gate; any other value is a
# schema ERROR — pointing it at a decoy file used to satisfy the wiring leg.
# status is a RATCHET: once a commit says "wired", a later commit saying
# "pending" is RED, not an edit.
# NEVER add a row for scripts/__cdcp_probe_unlisted__.py — that is the plant
# --prove-wired uses, and listing it makes the probe vacuous (the gate ERRORs).
# BUILT != WIRED. `status = "pending"` means the check.sh step has not landed
# yet: the gate reports the gap on stderr but does not fail, so the very commit
# that wires it is not blocked by its own absence. Once the orchestrator adds the
# step, flip this to "wired" in the same commit — from then on, deleting the step
# is RED. Empty or unknown status is a schema ERROR.
status = "wired"
check_sh = "scripts/check.sh"
invocation = "cargo run -q -p cdcp_gate -- substrate-guard || fail \"substrate guard\""
bead = "bd-substrate-rust-migration-jhd.1"

