stem = "A new chilled-water plant passes the contractor's startup checklist, but the project file has no integrated functional tests, O&M training record, or final system documentation. What review should flag this?"
choices = [
  "Completion, handover, acceptance, project finalization, as-built documentation, and training",
  "A contractor startup checklist as proof that every subsystem will interact correctly",
  "Manuals as a substitute for operator training and acceptance",
  "Postponing completion until the maintenance contract expires",
]
correct = "A"
explanation = "DOE FEMP's public commissioning process calls for functional-test and monitoring plans, deficiency analysis, retesting, and final hand-off documentation. A contractor startup checklist can be one input, but it does not prove integrated performance or supply the missing hand-off record."
