stem = "Vertical blanking panels and brush strip openings matter at the rack because they:"
choices = [
  "Only improve brand aesthetics at the rack, without affecting airflow",
  "Always increase bypass airflow intentionally",
  "Control airflow",
  "Have no interaction with cooling"
]
correct = "C"
explanation = "Blanking panels and brush strips seal the leakage paths that would otherwise let supply air bypass the equipment or exhaust recirculate to the intakes, so they are part of the inlet temperature story rather than trim. Calling the effect aesthetic is the tempting reading because they are visible cosmetic-looking parts, and the whole reason they are fitted is the air they stop."
