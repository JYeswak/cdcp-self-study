# Original CDESS educational MCQ — ms4j.4: KPI vs topology defect.
# Public heading: CDESS sustainability KPIs —
# https://www.epi-ap.com/services/1/3/107/Certified_Data_Centre_Environmental_Sustainability_Specialist_(CDESS)
# Cites: ISO/IEC 30134 series — KPIs are meters, not topology classes.
# Module content: "A good PUE does not make a hall concurrently maintainable."
# Decides KPI-TOPOLOGY CONFUSION, not a single target. bloom = understand.
# Options length-balanced; teaching lives in `explanation`.
id = "m02-q221"
kind = "single-select"
module = 2
stem = "A site claims PUE 1.15 and WUE 0.3 L/kWh. A reviewer asks whether the hall is concurrently maintainable. The correct framing is:"
choices = [
  "PUE 1.15 proves the hall is efficient, so concurrent maintainability is implied by the low energy overhead",
  "WUE 0.3 proves the cooling is dry/closed-loop, which typically correlates with higher availability designs",
  "ISO 30134 KPIs are meters, not topology — PUE/WUE do not answer whether a path can be isolated for maintenance",
  "The KPIs prove sustainability but do not prove Tier certification, so request the Uptime plaque instead",
]
correct = "C"
explanation = "ISO/IEC 30134 KPIs (PUE, WUE, CUE) measure energy and resource intensity. They do not describe topology, redundancy, or maintainability. A hall with excellent PUE can still have a single point of failure on the power path. Concurrent maintainability is a topology question — can you take a component out for maintenance without stopping IT load? That is answered by one-line review and Availability Class / Tier claims, not by a ratio. The defect is treating a meter as a topology proof."
topic_ids = ["m02-sustainability", "m02-kpis", "m02-standards"]
objective_ids = []
bloom = "understand"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
