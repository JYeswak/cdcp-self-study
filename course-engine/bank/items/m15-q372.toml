# Original CDFOS daily-operations MCQ — ms4j.2 security incident reporting.
# Public heading: CDFOS "Physical Security — Security incident reporting" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: NIST SP 800-53 Rev. 5, Release 5.2.0 (2025-08-27), IR-6(a)-(b) —
# https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final ;
# Claim: suspected incidents go to the incident-response capability within an organization-defined
# period and incident information goes to organization-defined authorities.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q372"
kind = "single-select"
module = 15
stem = "A security incident report says ‘door problem’ but has no route to the response function or defined authority. What gap is clearest?"
choices = [
  "Use defined incident-reporting channels",
  "Wait until the monthly security report is issued",
  "Send every alert to all staff without an owner",
  "Record only incidents affecting service uptime",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5, Release 5.2.0, IR-6(a) requires personnel to report suspected incidents to the organizational incident-response capability within an organization-defined time period, and IR-6(b) requires incident information to reach organization-defined authorities. The item does not invent a universal reporting interval or recipient list."
