explanation = "29 CFR 1910.157(c)(1) requires portable extinguishers to be mounted, located, and identified so they are readily accessible without exposing employees to possible injury. Section (c)(4) requires them to remain fully charged, operable, and in designated places except during use. The public rule does not establish a data-centre agent preference."
