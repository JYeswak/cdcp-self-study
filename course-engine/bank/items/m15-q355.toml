# Original CDFOS daily-operations MCQ — ms4j.2 emergency response plan.
# Public heading: CDFOS "Safety and Crisis Management — Emergency response plan requirement for various potential emergencies" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: 29 CFR 1910.38, eCFR current display 2026-08-17, (b), (c)(1)-(6), and (f) —
# https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-E/section-1910.38
# Claim: a required emergency action plan is written and available, contains the minimum response/evacuation/accounting/contact elements,
# and is reviewed when the plan or responsibilities change.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q355"
kind = "single-select"
module = 15
stem = "A data-centre emergency plan names a contact but omits evacuation routes, critical operations before evacuation, employee accounting, and review after changes. What finding is supported?"
choices = [
  "Add evacuation, accounting, critical-operations, contact, and review steps",
  "Keep the contact-only plan if the alarm test passes",
  "Move every emergency-plan detail into a vendor SLA and close the gap",
  "Wait for an evacuation drill before documenting any of the missing plan steps",
]
correct = "A"
explanation = "29 CFR 1910.38(b) requires a written emergency action plan kept in the workplace, and (c)(1)-(6) lists reporting, evacuation, critical-operations, accountability, rescue/medical, and contact elements. Paragraph (f) requires review when the plan is developed, responsibilities change, or the plan changes. An alarm test or vendor SLA does not replace those plan elements."
