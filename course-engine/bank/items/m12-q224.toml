module = 12
stem = "A maintenance practice that improves fire readiness is:"
choices = [
  "Taping over strobes to reduce noise permanently",
  "Keeping detection and fixed suppression systems inspected, tested, restored after alarms or repairs, and operable",
  "Blocking egress with storage",
  "Leaving agent cylinders empty until an emergency"
]
correct = "B"
explanation = "The current eCFR requires fire detection systems to remain operable, be tested and maintained by knowledgeable personnel, and be restored promptly after testing or alarm; fixed extinguishing systems must also be inspected and restored when impaired."
