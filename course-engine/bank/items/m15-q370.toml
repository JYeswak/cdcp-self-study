# Original CDFOS daily-operations MCQ — ms4j.2 maintenance tools.
# Public heading: CDFOS "Facilities Maintenance — Tools" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: NIST SP 800-53 Rev. 5, Release 5.2.0 (2025-08-27), MA-3(a)-(b), (1)-(2) —
# https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final ;
# clause text: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf
# Claim: maintenance tools are approved/controlled/monitored and reviewed at an organization-defined
# frequency; tools and diagnostic media are inspected for improper modification or malicious code.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q370"
kind = "single-select"
module = 15
stem = "A facilities maintenance tool is approved once, but there is no review cadence and diagnostic media are used without inspection. What source-backed gap remains?"
choices = [
  "Review tools and inspect diagnostic media",
  "Keep one approval and skip future reviews",
  "Use vendor packaging instead of inspection",
  "Allow any technician to bring tools inside",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5, Release 5.2.0, MA-3(a)-(b) requires approval, control, monitoring, and organization-defined review of system maintenance tools. MA-3(1) calls for inspecting tools for improper or unauthorized modification, and MA-3(2) calls for checking media containing diagnostic or test programs for malicious code before use. No review interval is invented here."
topic_ids = ["m15-maintenance-sla", "m15-ops-security"]
objective_ids = []
bloom = "apply"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
