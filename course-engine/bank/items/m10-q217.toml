id = "m10-q217"
kind = "single-select"
module = 10
stem = "An owner cites the EPA’s Quincy closed-loop water-reuse case to approve a different design: a sealed liquid loop rejecting heat to dry coolers with no evaporative tower. Which is the defensible M10 answer?"
choices = [
  "The cases are identical, so the EPA example proves that no makeup water, water rights, or permits need review",
  "Do not transfer the permission: the Quincy case is a site-specific water-reuse system with documented makeup, water-rights, discharge, and permit interfaces; confirm the dry-loop boundary and local approvals for this design, then report WUE using ISO/IEC 30134-9:2022 categories",
  "Closed loop always means WUE is zero, regardless of humidification or other site water",
  "Reject dry coolers because every data-centre cooling design must use an evaporative tower",
]
correct = "B"
explanation = "The EPA case is useful precisely because its closed-loop reuse system still required makeup water and site-specific rights and permits. DOE FEMP and the NREL ESIF report distinguish recirculating liquid paths and dry or evaporative heat rejection, but neither grants a universal siting permission. ISO/IEC 30134-9:2022 supplies the WUE KPI and measurement categories; it does not turn a project example into a benchmark or permit."
topic_ids = ["m10-importance", "m10-backup"]
objective_ids = ["obj-m10-closed-loop-siting"]
bloom = "analyze"
