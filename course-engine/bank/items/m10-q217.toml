stem = "Which statement matches the public preview of ISO/IEC 30134-9:2022?"
choices = [
  "It defines WUE as a KPI for quantifying data-centre water consumption during the use phase and provides measurement/reporting categories",
  "It grants a universal permit for non-evaporative cooling designs",
  "It makes WUE zero whenever a loop is described as closed",
  "It requires every data centre to use an evaporative cooling tower",
]
correct = "A"
explanation = "The ISO/IEC 30134-9:2022 public preview specifies WUE as a key performance indicator for quantifying data-centre water consumption during the use phase, and introduces measurement categories plus measurement, calculation, and reporting information. It does not grant permits, define a zero-water condition, or require one cooling architecture."
