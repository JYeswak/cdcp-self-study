# Options are length-balanced; the key is not the longest choice.
id = "m15-q341"
kind = "single-select"
module = 15
stem = "A maintenance vendor's contract ended Friday, but its badge still appears on the facility access list Monday. What control action should the CDFOM manager take?"
choices = [
  "Keep the badge active until the next quarterly security review",
  "Remove the vendor from the access list when access is no longer required",
  "Move the badge to a shared visitor account so the audit trail stays short",
  "Leave it active because a signed contract is the access authorization",
]
correct = "B"
explanation = "NIST SP 800-53 Rev. 5 PE-2 requires the organization to maintain the authorized-access list, issue credentials, review the list at an organization-defined frequency, and remove individuals when access is no longer required. PE-2(1) also supports role-based facility access. A contract, visitor account, or future review does not preserve least-privilege access after the business need ends."
