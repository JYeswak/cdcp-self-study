# Original CDFOS daily-operations MCQ — ms4j.2 bounded asset recording.
# Public heading: CDFOS "Governance and Compliance — Requirements or asset recording" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: NIST SP 800-53 Rev. 5, Release 5.2.0 (2025-08-27), CM-8(a)-(b) and (1) —
# https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final ;
# clause text: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf
# Claim: a component inventory accurately reflects all components, supports accountability, is reviewed
# at an organization-defined frequency, and is updated during installation/removal/system updates.
# This is bounded asset recording, not a paywalled ISO 55000 asset-management claim.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q373"
kind = "single-select"
module = 15
stem = "An equipment register lists some rack assets but omits components, accountability, and an update cadence. What source-backed correction fits?"
choices = [
  "Keep a complete, current component inventory",
  "List only new hardware until the next audit",
  "Track serial numbers only after a failure",
  "Replace the inventory with a procurement forecast",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5, Release 5.2.0, CM-8(a) requires an inventory that accurately reflects the system, includes all components, has needed tracking granularity, and includes information for component accountability; CM-8(b) requires review and update at an organization-defined frequency. CM-8(1) adds updates during component installation, removal, and system updates. This item stays at asset recording and does not claim ISO 55000 or a complete asset-management lifecycle."
topic_ids = ["m15-documentation", "m15-ops-security"]
