module = 15
stem = "A DOE facilities department is planning development for shift leads. Which manager artifact matches DOE O 360.1D?"
choices = [
  "Use job-based IDPs with competency goals",
  "Use one annual attendance total detached from job duties",
  "Reserve career development for employees after promotion",
  "Treat a vendor completion badge as the succession plan",
]
correct = "A"
explanation = "DOE O 360.1D, approved December 9, 2022, says an Individual Development Plan supports career development and should be based on job requirements, professional development, and needed competencies in 4.a.(4)(a)-(b). Section 4.a.(6)(a)-(b) supports developing competencies through training, rotational or developmental assignments, and competency-based career planning. The Order applies to DOE Federal employees, so this scenario does not claim a universal private-sector mandate or a credential requirement."
