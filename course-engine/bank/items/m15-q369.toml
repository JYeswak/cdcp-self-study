# Original CDFOS daily-operations MCQ — ms4j.2 safety roles.
# Public heading: CDFOS "Safety and Crisis Management — The roles and responsibilities of appointed safety staff" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: U.S. Department of Energy, NE O 422.1 Conduct of Operations, approved August 2025,
# Attachment 2 paragraph 2.a.(1), (3), and (5), p. 2-2 — https://id.energy.gov/Home/DownloadDocument/5643
# Claim: a conduct-of-operations organization defines roles/accountability, safe-work accountability,
# and hazard-analysis/control methods. The source is a bounded operations model, not universal CDFOS law.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q369"
kind = "single-select"
module = 15
stem = "A data-centre operations program names a safety lead but never states who has safety authority, who is accountable, or how hazards are controlled. What action matches the public conduct-of-operations model?"
choices = [
  "Define safety roles, authority, and hazard controls",
  "Add a logo to the roster and leave authority implicit",
  "Replace the role map with a vendor contact list",
  "Wait for an incident before assigning responsibilities",
]
correct = "A"
explanation = "NE O 422.1 Attachment 2 paragraph 2.a.(1) calls for organizational roles, responsibilities, authority, and accountability; 2.a.(3) addresses monitoring and worker accountability for safe work; and 2.a.(5) addresses hazard analysis and hazard controls. This item applies that public conduct-of-operations model as a benchmark and does not turn it into a universal data-centre regulation."
