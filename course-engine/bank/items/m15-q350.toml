# source = "NIST SP 800-88 Rev. 2 (September 2025), §§4.3.1, 4.3.6, 4.5.1-4.5.2, 4.6, and Appendix C — https://csrc.nist.gov/pubs/sp/800/88/r2/final ; clause text: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-88r2.pdf"
# claim = "Before an IT storage asset is reused or released, the organization records the sanitization decision, validates the outcome, and tracks the post-sanitization destination."
# Options are length-balanced; the key is not the longest choice.
id = "m15-q350"
kind = "single-select"
module = 15
stem = "A retired storage device will be reused by another tenant. Which manager control best matches NIST SP 800-88 Rev. 2?"
choices = [
  "Record sanitization and its destination",
  "Transfer it after confirming the hardware still boots",
  "Rely on the previous tenant's confidentiality label",
  "Keep only a recycler invoice after the hand-off",
]
correct = "A"
explanation = "NIST SP 800-88 Rev. 2 §4.3.1 places sanitization decisions before the disposal phase; §4.3.6 says to record the decision and provide the process and resources; §§4.5.1-4.5.2 require verification and validation; and §4.6 plus Appendix C support records tied to the asset and its destination. A device that powers on is not evidence that its prior data was sanitized."
