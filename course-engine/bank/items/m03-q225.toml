# Original CDMS educational MCQ — ms4j.6: dual-run / parallel operation.
# Public heading: CDMS "Data Centre Migration" —
# https://www.epi-ap.com/services/1/3/56/Certified_Data_Centre_Migration_Specialist_(CDMS)
# Cites: ISO/IEC 20000-1:2018 §8.5.1 "Change management" —
# https://www.iso.org/standard/70636.html
# Dual-run validates the new environment before decommissioning the old.
# Decides VALIDATION SEQUENCE, not a specific tool. bloom = apply.
# Options length-balanced; teaching lives in `explanation`.
id = "m03-q225"
kind = "single-select"
module = 3
stem = "A migration team proposes: cutover Friday night, decommission old servers Monday morning. The change-management gap is:"
choices = [
  "No dual-run window — production traffic cannot validate the new environment before the old is gone",
  "Acceptable — weekend traffic is low, so Monday decommission is safe without parallel validation",
  "Acceptable if monitoring dashboards show no errors during the weekend cutover window",
  "No gap — Friday-to-Monday is a standard dual-run period for enterprise migrations",
]
correct = "A"
explanation = "ISO/IEC 20000-1:2018 §8.5.1 requires changes be validated before irreversible actions. A cutover-then-decommission schedule with no dual-run window means the old environment is destroyed before production traffic can expose latent defects in the new one. Dashboards may miss application-level failures that only appear under real load. A dual-run period keeps both environments live so rollback is instant if the new path fails."
topic_ids = ["m03-migration", "m03-change-management"]
objective_ids = []
bloom = "apply"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
