# Original CDFOS daily-operations MCQ — ms4j.2 security SOP.
# Public heading: CDFOS "Physical Security — Standard Operating Procedures (SOP) for security" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: ISO/IEC 22237-6:2024, Information technology — Data centre facilities and
# infrastructures — Part 6: Security systems, official catalog/preview:
# https://www.iso.org/cms/%20render/live/en/sites/isoorg/contents/data/standard/08/22/82250.html
# Claim: physical security of data centres includes protection against unauthorized access
# and intrusion using organizational and technological solutions.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q358"
kind = "single-select"
module = 15
stem = "A physical-security SOP verifies a badge at entry but never keeps access logs or changes keys when a holder transfers. What gap remains?"
choices = [
  "Keep access logs and change keys on the defined triggers",
  "Add a second badge reader while leaving records and keys unchanged",
  "Replace the SOP with a visitor survey and a monthly door count",
  "Trust the badge vendor's firmware report as the facility access record",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5 PE-3 requires verification of individual access authorizations and controlled ingress/egress, maintenance of physical-access audit logs, and changes to combinations or keys at the defined frequency and when keys are lost, compromised, or their holders transfer or terminate. A reader or vendor report does not replace those procedure controls."
