explanation = "NFPA 72 (2025) §§3.3.70.10 and 26.6.3.2.2.2 keep rate-of-temperature-rise detection and listed fire-alarm signaling in their proper boundaries. A fast EMS/DCIM page can support operations and correlation, but it does not automatically replace the listed FACU path or justify one universal row threshold."
