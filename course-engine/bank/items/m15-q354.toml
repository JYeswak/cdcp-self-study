# Original CDFOS daily-operations MCQ — ms4j.2 service improvement.
# Public heading: CDFOS "Service Level Management — Service Improvement Process (SIP)" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: ISO/IEC 20000-1:2018, Information technology — Service management — Part 1:
# Service management system requirements, official catalog/preview:
# https://www.iso.org/cms/%20render/live/en/sites/isoorg/contents/data/standard/07/06/70636.html
# Claim: a service management system includes continual improvement of services.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q354"
kind = "single-select"
module = 15
stem = "Which objective is explicitly included in the public preview of ISO/IEC 20000-1:2018 for a service management system?"
choices = [
  "Continually improve the planning, delivery, and improvement of services",
  "Freeze service processes after the first successful delivery",
  "Replace service management with a one-time satisfaction survey",
  "Measure purchase cost without reviewing service performance",
]
correct = "A"
explanation = "The ISO/IEC 20000-1:2018 public preview says the requirements include planning, design, transition, delivery, and improvement of services, and that an organization can improve those activities through effective implementation and operation of a service management system. It does not prescribe a trend threshold or service-catalogue sequence."
