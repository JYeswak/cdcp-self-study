# Original CDESS educational MCQ — ms4j.4: PUE boundary defect.
# Public heading: CDESS sustainability KPIs —
# https://www.epi-ap.com/services/1/3/107/Certified_Data_Centre_Environmental_Sustainability_Specialist_(CDESS)
# Cites: ISO/IEC 30134-2 (PUE) — boundary definitions matter.
# The Green Grid PUE guidance (public white papers) also addresses boundary.
# Decides BOUNDARY DEFECT, not a single PUE target as law. bloom = analyze.
# Options length-balanced; teaching lives in `explanation`.
id = "m02-q220"
kind = "single-select"
module = 2
stem = "A vendor claims PUE 1.2 for a hall. The metering boundary excludes the chiller plant because it serves multiple tenants. The sustainability review finding is:"
choices = [
  "Acceptable — shared chillers are outside the tenant's control, so excluding them from PUE is standard practice",
  "Boundary defect — PUE must include all facility energy supporting the IT load; excluding chillers understates the ratio",
  "Acceptable if the vendor states PUE 1.2 is IT-only, since IT-only PUE is a recognized alternative metric",
  "Boundary defect — PUE should exclude chillers AND UPS losses to show true IT efficiency",
]
correct = "B"
explanation = "ISO/IEC 30134-2 defines PUE as total facility energy divided by IT energy. The numerator must include all energy supporting the IT load — cooling, power distribution, lighting, security. Excluding the chiller plant because it is shared does not change that the chillers cool this IT load. A PUE that omits cooling understates the facility's energy intensity. There is no 'IT-only PUE' in the standard. The boundary defect is claiming a PUE while excluding a major load category."
topic_ids = ["m02-sustainability", "m02-kpis"]
objective_ids = []
bloom = "analyze"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
