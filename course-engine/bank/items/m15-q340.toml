# claim = "Role-based training is tied to assigned duties, system changes, and a defined recurrence; AT-3(1) includes facility environmental controls."
# Options are length-balanced; the key is not the longest choice.
id = "m15-q340"
kind = "single-select"
module = 15
stem = "The skills matrix for a data-center facilities team lists HVAC, power, and fire-detection roles. A control-system change is approved, but no role-based training update is planned. What manager action is directly supported?"
choices = [
  "Update role training before the changed duty begins",
  "Keep the matrix because the vendor sent a change notice",
  "Replace the matrix with one annual attendance total",
  "Wait for an incident, then train only the person who changed it",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5 AT-3 requires role-based training before assigned duties, when system changes require it, and at an organization-defined frequency; AT-3(c) incorporates lessons from incidents. AT-3(1) specifically includes environmental controls such as fire detection, temperature, HVAC, and power. A vendor notice is not the affected role's training record, and waiting for an incident reverses the control's timing."
topic_ids = ["m15-ops-security", "m15-documentation"]
