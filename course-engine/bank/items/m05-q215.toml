id = "m05-q215"
kind = "single-select"
module = 5
stem = "During an egress walk, a team points to illuminated EXIT signs and says the emergency-lighting check is done. The best response is:"
choices = [
  "Check egress lighting separately",
  "Treat EXIT signs as proof of all lighting",
  "Skip it if the IT UPS is healthy",
  "Check only normal rack task lighting",
]
correct = "A"
explanation = "NFPA 101 (2024) §7.9.1.1 addresses emergency-lighting facilities for the means of egress in the conditions listed by the Code. An illuminated EXIT sign supports wayfinding, but it does not by itself demonstrate that the required egress emergency-lighting facilities are installed, powered, and ready."
