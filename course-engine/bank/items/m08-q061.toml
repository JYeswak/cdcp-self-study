id = "m08-q061"
kind = "single-select"
module = 8
stem = "Cage nuts and matching screws matter because:"
choices = [
  "Matching fasteners prevent unreliable rail mounts",
  "Any screw size works in every rail without checking thread or engagement",
  "Tool-less rails forbid all fasteners forever, even for accessories",
  "Grounding is achieved only by paint",
]
correct = "A"
explanation = "Square-hole rails need cage nuts matched to the screw; threaded rails need the right thread. A partly-engaged screw carries the load until it does not, and the failure appears under service loading rather than at install. Assuming any screw works is the error, and tool-less rails do not remove fasteners -- accessories still mount conventionally."
