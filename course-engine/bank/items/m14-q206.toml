id = "m14-q206"
kind = "single-select"
module = 14
stem = "RFC 5424 separates syslog into which conceptual layers?"
choices = [
  "Syslog content, the syslog application layer, and the syslog transport layer",
  "Only SMS, voice calls, and ticket queues, with no message or transport model",
  "Only a database layer and a rack-power layer",
  "No layers; every implementation must use one vendor-specific format"
]
correct = "A"
explanation = "RFC 5424 defines syslog content as management information, a syslog application layer for generation/interpreting/routing/storage, and a transport layer that puts messages on and takes them off the wire. It does not prescribe SMS, call-tree, or facility-escalation policy."
