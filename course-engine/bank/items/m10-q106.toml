stem = "On-site water storage tanks for cooling support are sized conceptually against:"
choices = [
  "Only the number of network racks, without considering water demand or outage duration",
  "Only indoor lighting and occupancy, regardless of cooling mode",
  "Expected outage duration, makeup rates, and which plant modes need water",
  "Only fiber counts; water storage is independent"
]
correct = "C"
explanation = "Storage is sized against the scenario: how long supply could be out, how fast the plant consumes makeup, and which operating modes actually need water. Rack counts and fibre counts describe IT density, not water demand, so none of them constrains tank volume."
