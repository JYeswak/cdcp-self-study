# Original CDCS educational MCQ — ms4j.1: battery autonomy calc defect.
# Public heading: CDCS Power Systems engineering calcs —
# https://www.epi-ap.com/services/1/3/5/Certified_Data_Centre_Specialist_(CDCS)
# Engineering principle: UPS runtime is stated at a specific kW load; runtime
# collapses nonlinearly as load increases. A vendor quote must state the load
# at which the runtime was calculated.
# Decides CALC DEFECT, not name-recall. bloom = analyze.
# Options length-balanced; teaching lives in `explanation`.
id = "m06-q305"
kind = "single-select"
module = 6
stem = "A UPS vendor proposal says '15 minutes battery autonomy.' The one-line shows 400 kVA UPS with 320 kW IT load today and 25% growth planned. The calc defect to catch is:"
choices = [
  "15 minutes is acceptable because vendor proposals always state worst-case runtime at full nameplate load",
  "The proposal omits the load at which 15 minutes was calculated — runtime at 320 kW differs from runtime at 400 kW",
  "15 minutes is too long for modern UPS systems and suggests the battery bank is oversized for the application",
  "The proposal should state runtime in kVA, not minutes, since minutes depend on an unstated power factor",
]
correct = "B"
explanation = "UPS battery runtime is not a fixed constant — it is calculated at a specific kW load. A '15 minutes' claim without the load is incomplete: 15 minutes at 200 kW may be 8 minutes at 320 kW and less at growth load. The review must ask: 15 minutes at what kW? Nameplate (400 kVA × PF) or actual (320 kW) or growth (400 kW)? The one-line defect is the missing load assumption behind the runtime number."
topic_ids = ["m06-ups", "m06-battery"]
objective_ids = []
bloom = "analyze"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
