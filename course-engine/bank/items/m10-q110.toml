stem = "Legionella and biological control programs for tower water exist primarily to:"
choices = [
  "Increase scale formation as a deliberate way to stabilize water chemistry in the tower",
  "Cool servers by introducing beneficial bacteria into the condenser-water loop",
  "Manage health and operational risks from biological growth in water systems",
  "Replace physical security controls because biological risk is the only operational concern"
]
correct = "C"
explanation = "Warm, aerated, recirculating tower water is a favourable environment for Legionella, so the control programme exists for occupant health first and fouling second. The remaining options treat biological growth as either useful or as a substitute for unrelated controls, when the programme is specifically about suppressing it."
