id = "m15-q343"
kind = "single-select"
module = 15
stem = "A controller is sent off-site for repair. The maintenance record has a work order, but no approval for removal and no post-repair control check. Which CDFOM review finding is supported?"
choices = [
  "Add removal approval and a post-repair control check",
  "Close the record when the vendor returns the controller",
  "Open a purchase order even when the controller is repaired",
  "Delete the old record when the replacement arrives",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5 MA-2 requires maintenance records, approval and monitoring of maintenance, explicit approval before a component leaves the facility for off-site work, and verification that potentially affected controls still function afterward. A work order or replacement purchase record does not supply either missing control."
