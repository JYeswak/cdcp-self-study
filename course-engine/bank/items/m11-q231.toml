# FORM FIX under bd-curriculum-truth-ebrr.46 (2026-08-17). No content change.
#   BEFORE: option lengths [61, 90, 60, 360], key D = 4.77x median and longest by 270
#           chars — answerable by picking the paragraph without reading the stem.
#   AFTER:  four verdicts of comparable length; the key is not the longest option.
#   The teaching that lived in the keyed option now lives in `explanation`, where it
#   is read after the learner has already had to choose. The five taught propositions
#   are unchanged: (1) east-west IB/RoCE 400/800G is an availability path equal to
#   power; (2) one cut / one shared tray / one polarity miss is one training job;
#   (3) dual laterals are the building oral, not fabric protection; (4) interconnect
