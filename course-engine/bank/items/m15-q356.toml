# Original CDFOS daily-operations MCQ — ms4j.2 shift handover.
# Public heading: CDFOS "Data Centre Operations — Shift handover" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: 29 CFR 1910.147(f)(4), eCFR current 2026-08-14 —
# https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-J/section-1910.147
# Claim: when lockout/tagout protection spans a shift or personnel change, a specific
# procedure ensures continuity and orderly transfer between off-going and oncoming employees.
# This is bounded to hazardous-energy protection, not a general handover program.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q356"
kind = "single-select"
module = 15
stem = "A night-shift turnover says 'all normal' but lists neither equipment status nor in-progress work, and the oncoming operator cannot identify relief duties. What gap does the public conduct-of-operations model expose?"
choices = [
  "Transfer equipment status, duties, and active or planned work",
  "Add a service-level percentage and leave the turnover record unchanged",
  "Replace it with a vendor invoice and a maintenance calendar only",
  "Limit it to badge counts because equipment status is an engineering matter",
]
correct = "A"
explanation = "NE O 422.1 Attachment 2 paragraph 2.l requires practices for thorough, accurate transfer of information and responsibilities at shift or operator relief. Appendix A 2.l.(1)-(3) covers formal turnover positions, equipment/facility status, duties and responsibilities, in-progress or planned activities, and reliefs. The order says operations includes computer centers; this item applies that framework rather than declaring a universal legal requirement."
topic_ids = ["m15-ops-security", "m15-documentation"]
