# Original CDFOS daily-operations MCQ — ms4j.2 shift handover.
# Public heading: CDFOS "Data Centre Operations — Shift handover" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: 29 CFR 1910.147(f)(4), eCFR current 2026-08-14 —
# https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-J/section-1910.147
# Claim: when lockout/tagout protection spans a shift or personnel change, a specific
# procedure ensures continuity and orderly transfer between off-going and oncoming employees.
# This is bounded to hazardous-energy protection, not a general handover program.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q356"
kind = "single-select"
module = 15
stem = "During a shift change while a cooling plant remains under a group lockout/tagout procedure, what handover action is required?"
choices = [
  "Use a specific procedure for orderly transfer of lockout/tagout protection between off-going and oncoming employees",
  "Treat an 'all normal' shift note as sufficient without transferring protection",
  "Transfer the vendor invoice and leave the energy-control responsibility implicit",
  "Remove the lockout devices at shift change so the next operator can restart the plant",
]
correct = "A"
explanation = "29 CFR 1910.147(f)(4) requires specific procedures during shift or personnel changes so lockout/tagout protection continues, including orderly transfer of protection between off-going and oncoming employees. The rule supports this bounded maintenance-handover decision; it does not create a universal operations shift-log or handover taxonomy."
