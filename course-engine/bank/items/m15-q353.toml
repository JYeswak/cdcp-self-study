# Original CDFOS daily-operations MCQ — ms4j.2 service-level agreements.
# Public heading: CDFOS "Service Level Management — Service Level Agreements" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cites: NIST SP 800-53 Rev. 5, Release 5.2.0 (2025-08-27), SA-9(a)-(c)
# and discussion; UK Government Digital and Data Profession Capability Framework,
# IT service manager, last updated 2025-08-29 —
# https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final ;
# https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf ;
# https://ddat-capability-framework.service.gov.uk/role/it-service-manager
# Claim: service-level documentation makes outcomes, remedies, and response requirements measurable;
# the government role framework also assigns definition of SLAs and OLAs across relevant business functions.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q353"
kind = "single-select"
module = 15
stem = "A facilities provider's SLA names a price and a phone number; internal facilities and NOC commitments are absent. Which review action is supported?"
choices = [
  "Define cross-team OLA duties and measurable SLA outcomes",
  "Treat the phone number as the OLA and stop reviewing performance",
  "Replace the SLA with a facilities asset register",
  "Publish an uptime percentage without owners or remedy terms",
]
correct = "A"
explanation = "NIST SP 800-53 Rev. 5, Release 5.2.0, SA-9 requires oversight and roles for external services and ongoing compliance monitoring; its discussion says service-level agreements define measurable outcomes, remedies, and response requirements. The UK Government Digital and Data Profession Capability Framework says an IT service manager defines SLAs and OLAs across relevant business functions. No uptime percentage is invented here."
topic_ids = ["m15-maintenance-sla"]
