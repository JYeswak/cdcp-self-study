# Original CDFOS daily-operations MCQ — ms4j.2 service-level agreements.
# Public heading: CDFOS "Service Level Management — Service Level Agreements" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: ISO/IEC 20000-1:2018, Information technology — Service management — Part 1:
# Service management system requirements, official catalog/preview:
# https://www.iso.org/cms/%20render/live/en/sites/isoorg/contents/data/standard/07/06/70636.html
# Claim: the service-management lifecycle includes planning, design, transition, delivery,
# and improvement, and can be used for a consistent approach across service providers,
# including a supply chain.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q353"
kind = "single-select"
module = 15
stem = "A facilities provider's SLA review asks whether its service lifecycle is consistent across providers and the supply chain. Which ISO/IEC 20000-1:2018 scope fits?"
choices = [
  "Plan, design, transition, deliver, and improve the services consistently",
  "Limit the review to the supplier's purchase price",
  "Replace lifecycle review with a facilities asset register",
  "Publish an uptime percentage without reviewing service delivery",
]
correct = "A"
explanation = "The ISO/IEC 20000-1:2018 public preview includes planning, design, transition, delivery, and improvement of services, and says a customer may require a consistent approach to the service lifecycle by all service providers, including those in a supply chain. It does not establish an OLA taxonomy or an uptime value."
