id = "m07-q213"
kind = "single-select"
module = 7
stem = "For a first-pass density check, use the long straight-conductor approximation B = μ₀I/(2πr). A 2026 GPU-hall scenario has one idealized 12 kA bus conductor and an observation point 2.0 m away. What field magnitude follows before return-conductor cancellation and bus geometry are considered?"
choices = [
  "1.2 × 10^-3 T (1.2 mT)",
  "1.2 × 10^-6 T (1.2 µT)",
  "1.2 × 10^-2 T (12 mT)",
  "1.2 × 10^0 T (1.2 T)",
]
correct = "A"
explanation = "B = (4π×10^-7 H/m)(12,000 A)/(2π×2.0 m) = 1.2×10^-3 T. Density does not change the physics; it scales MAGNITUDE with current. This is an idealized field magnitude, not an ICNIRP 2010 limit or a compliance result; phase/return geometry and a site survey can materially change the measured field."
