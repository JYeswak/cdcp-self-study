stem = "Which description matches the public preview of ISO 55001:2024 for asset management?"
choices = [
  "Balance asset lifecycle performance, risk, and expenditure against organizational goals",
  "Optimize purchase price while ignoring lifecycle risk and performance",
  "Manage only the disposal step after operations have ended",
  "Use a vendor invoice as the asset-management system",
]
correct = "A"
explanation = "The ISO 55001:2024 public preview says effective asset management controls the lifecycle of assets while balancing performance, risk, and expenditure to meet organizational goals. It does not reduce asset management to purchase price, disposal alone, or an invoice."
