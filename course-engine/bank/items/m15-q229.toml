# Original CDCP educational MCQ — ms4j.2.4 CDFOS LOTO procedure leftover.
# Public heading: CDFOS "Proper lock-out/tag-out procedures" (Safety and Crisis
# Management) — https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cites: 29 CFR 1910.147(f)(4) shift/personnel changes; 1910.147(f)(2) outside
# personnel; 1910.147(d)(5)(ii) stored-energy reaccumulation.
# eCFR display current as of 2026-08-13 (Title 29 last amended 2026-08-04).
# https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-J/section-1910.147
# Decides CONTINUITY across a shift boundary, not a citation-number quiz.
# Options are length-balanced on purpose; teaching lives in `explanation`.
id = "m15-q229"
kind = "single-select"
module = 15
stem = "A vendor crew has a chilled-water pump locked out and the job will run past shift change. The off-going technician's personal lock is the only lock on the isolating device. What must the energy-control procedure require at the handover?"
choices = [
  "Orderly transfer of the lockout device to the oncoming technician, so the isolation is never left unheld at any point",
  "Removal of the off-going lock at end of shift and application of a fresh lock when the oncoming technician takes over",
  "Reassignment of the permit to the oncoming shift supervisor, whose signature carries the isolation until the crew returns",
  "A tag on the device naming the off-going technician and a contact number, since a tag documents isolation when no one is on site",
]
correct = "A"
explanation = "1910.147(f)(4) requires specific procedures for shift or personnel changes to ensure continuity of lockout or tagout protection, including orderly transfer of the devices between off-going and oncoming employees. Option B is the trap: removing the lock first opens an interval in which an isolated device is held by nobody, which is precisely the gap the paragraph exists to close. A signature (C) and a tag (D) are records, not devices holding an isolation. Two further requirements bear on this job: 1910.147(f)(2) requires the on-site employer and the outside (vendor) employer to inform each other of their respective energy-control procedures, so a contractor crew does not import unread practice; and 1910.147(d)(5)(ii) requires verification of isolation to continue where stored energy can reaccumulate to a hazardous level, which a pump loop with a head of water can."
