stem = "Aligning facility investment with business criticality means:"
choices = [
  "Matching redundancy and operating discipline to the impact of loss for the served services",
  "Using marketing slogans as the design input, without connecting facility controls to the impact of service loss",
  "Ignoring RTO/RPO when siting and designing, because business continuity belongs to application owners",
  "Spending the same capital on each closet independent of impact, service dependency, or the cost of an outage"
]
correct = "A"
explanation = "Facility investment should match the impact of losing the served service, including redundancy and operating discipline; slogans, ignoring recovery objectives, and equal spending on every closet discard that business context."
