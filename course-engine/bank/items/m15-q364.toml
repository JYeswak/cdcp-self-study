id = "m15-q364"
kind = "single-select"
module = 15
stem = "Which purpose is explicitly covered by the public preview of ISO 22301:2019?"
choices = [
  "Prepare for, respond to, and recover from disruptions through a business continuity management system",
  "Specify one universal recovery-time objective for every organization",
  "Replace continuity planning with a vendor contract",
  "Certify a facility solely from its business-impact analysis",
]
correct = "A"
explanation = "The ISO 22301:2019 public preview describes a business continuity management system that helps organizations prepare for, respond to, and recover from disruptions. It does not expose a universal recovery-time objective or certify a facility from a BIA alone."
