# Corpus rights policy — the machine-checkable invariants for everything under
# knowledge/corpus/.
#
# This file is the ENFORCEMENT TARGET. It exists so the rule survives the agent
# that wrote it. Prose in README.md and FREE-ACCESS-CAPTURE.md explains the rule;
# this file *is* the rule, and the corpus-rights gate (bead D4) reads it.
#
# Written 2026-08-14 closing bd-ashrae-redistribution-contradiction-p5n and
# bd-doe-guide-embeds-ashrae-p54.

schema = "cdcp.corpus.rights-policy.v1"
date = "2026-08-14"

# ---------------------------------------------------------------------------
# Vocabulary. These are the ONLY legal values. An unrecognised value is an
# ERROR, not a pass — a typo must never read as permission.
# ---------------------------------------------------------------------------

[vocabulary]
# What the repository physically holds for a source.
capture = [
  "body-retained",   # publisher-derived prose/binary is stored in-tree
  "citation-only",   # ONLY {url, title, publisher, fetched_at, rights, redistribution}
  "not-vendored",    # nothing stored; registered so the decision is not re-litigated
]

# Who owns the copyright. NOT a price fact.
#
# ADDED 2026-08-14 (bd-corpus-public-captures-not-licensed-class-kej): the two
# self-owning values below were already IN USE by live records
# (src-curriculum-map-local, src-doe-femp-bpg-dc-design) while absent from this
# list. A vocabulary that does not contain the values the corpus actually carries
# cannot enforce anything: every conforming record reads as out-of-vocabulary and
# the list stops being consulted. The list is the contract, so the list is what
# had to change.
rights = [
  "public-domain",                 # e.g. 17 USC 105, government-AUTHORED portions only
  "open-licence",                  # named permissive/reciprocal licence, recorded per document
  "own-work-this-repo",            # authored here; redistribution is ours to grant
  "publisher-retains-copyright",
  "publisher-copyright",           # legacy spelling used by free-pdfs/*.meta.toml sidecars
  "mixed-us-government-work-with-third-party-material",  # see CORPUS-R3
  "unknown",                       # ERROR-equivalent: blocks body-retained
]

# `rights` values that are SELF-EVIDENCING for redistribution: the project either
# authored the work or the work carries no copyright, so "permitted" needs no
# third-party licence behind it. Every OTHER value must carry
# `redistribution_evidence` before a body may be retained — see CORPUS-R7.
self_evidencing_rights = ["public-domain", "own-work-this-repo"]

# Whether THIS repository may republish the bytes to the world.
redistribution = [
  "permitted",
  "not-licensed",
  "NOT-licensed",   # legacy spelling used by free-pdfs/*.meta.toml sidecars
  "unknown",        # ERROR-equivalent: blocks body-retained
]

# Whether the bytes may be entered into an AI tool at all.
ai_ingestion = ["permitted", "PROHIBITED", "unknown"]

# ---------------------------------------------------------------------------
# The published tree. Everything under these paths is world-readable at
# github.com/JYeswak/cdcp-self-study. Committing here IS publication.
# ---------------------------------------------------------------------------

[published_tree]
roots = [
  "course-engine/knowledge/corpus/public",
  "course-engine/knowledge/corpus/free-pdfs",
]
note = """Retaining a capture for internal grounding and pushing it to a public
remote are different acts. The second is redistribution. `access = "free"` is a
PRICE fact about the publisher's own site; it authorises neither."""

# ---------------------------------------------------------------------------
# INVARIANTS. Each one is a gate assertion. `severity = "error"` means the gate
# exits non-zero and names the offending file. No invariant here may be
# satisfied vacuously.
# ---------------------------------------------------------------------------

[[invariant]]
id = "CORPUS-R1"
severity = "error"
title = "No unlicensed body may live inside the published tree"
rule = """For every corpus source record (manifest.json `sources[]` and every
free-pdfs/*.meta.toml sidecar): if redistribution != "permitted", then capture
MUST NOT be "body-retained" and no `path` under published_tree.roots may exist
on disk."""
rationale = """The manifest's own retention_basis says the purpose of a capture
is "so the claim can be re-verified at source". A citation row serves that
purpose completely. Publishing the publisher's prose serves it no better and is
an act the manifest itself records as unlicensed."""
generalises = "Not an ASHRAE special case. Applies to every publisher, every format, forever."

[[invariant]]
id = "CORPUS-R2"
severity = "error"
title = "Missing rights fields are an ERROR, never default-permissive"
rule = """Every corpus source record MUST carry non-empty `rights`,
`redistribution` and `capture`. A record missing any of the three FAILS. A value
outside [vocabulary] FAILS. Absence must never be read as permission."""

[[invariant]]
id = "CORPUS-R3"
severity = "error"
title = "Third-party material inside a government work is not public domain"
rule = """If a record declares a non-empty `third_party_figures` list, then
`rights` MUST NOT be "public-domain" and `redistribution` MUST NOT be
"permitted"."""
rationale = """17 USC 105 covers the government-AUTHORED portions of a work only.
A US Government PDF that reproduces ASHRAE tables under attribution does not
launder those tables into the public domain. Government-PUBLISHED is not
government-AUTHORED throughout: check the figure credits, not the cover."""

[[invariant]]
id = "CORPUS-R4"
severity = "error"
title = "An exception must carry a reason and a bead"
rule = """A record may be exempted from R1 only by carrying
rights_review = "OPEN" AND a non-empty rights_review_bead AND a non-empty
rights_review_reason. A bare exemption, an empty reason string, or an exemption
without a bead is a SCHEMA ERROR, not a pass."""

[[invariant]]
id = "CORPUS-R5"
severity = "error"
title = "Never vacuously green"
rule = """If the gate scans zero corpus records, zero manifest sources, or zero
.meta.toml sidecars, it MUST exit non-zero. An empty input set is an ERROR. A
corpus that was never checked must never report identically to one that passed."""

[[invariant]]
id = "CORPUS-R6"
severity = "error"
title = "AI-ingestion-prohibited sources may not be body-retained"
rule = """If ai_ingestion = "PROHIBITED", capture MUST be "citation-only" or
"not-vendored"."""
rationale = """ASHRAE's published AI policy prohibits entering content from any
ASHRAE publication or related ASHRAE IP into any AI tool, and prohibits
AI-created derivative works without express written permission. This repository
is AI-built end to end, so an in-tree ASHRAE body is ingested by construction."""

[[invariant]]
id = "CORPUS-R7"
severity = "error"
title = "\"permitted\" over third-party rights must name the licence"
rule = """If capture = "body-retained" and redistribution = "permitted" and
`rights` is NOT in [vocabulary].self_evidencing_rights, the record MUST carry a
`redistribution_evidence` table with non-empty `licence`, `url` and `clause`.
A bare "permitted" over someone else's copyright is an assertion, not a
licence."""
rationale = """R1 keys entirely on the STRING "permitted", so R1 alone is
satisfied by typing it. That is not a hypothetical: every one of the ten records
swept in this bead was classified on an INHERITED DEFAULT rather than on
evidence, and one of them (src-curriculum-map-local) was wrong in the permissive
direction's mirror image — restrictively. A default is an unrecorded decision
wearing a value, and it can point either way. R7 is the cost of pointing it at
"permitted": name the licence, link it, cite the clause. This is also the
GROWTH path, not only a brake — a genuinely open document (OCP's OCPHL and CC-BY
specifications are the live candidates) can be body-retained the moment its
licence is recorded here."""

[[invariant]]
id = "CORPUS-R8"
severity = "error"
title = "A file in the published tree with no record is an ERROR"
rule = """Every regular file under published_tree.roots, other than the registry
files themselves (`manifest.json`, `*.meta.toml`), MUST be claimed by the `path`
of exactly one corpus record. An unclaimed file is an ERROR, never a pass."""
rationale = """R1 and R2 both reason from the RECORD outward. A capture that
arrives with no record at all is therefore invisible to them, and that is
precisely how the next one arrives: dropped into the directory by a fetch script,
never registered, and no rule ever names it. Enforcement has to run in both
directions — record-to-file and file-to-record — or the unregistered case is the
only case that passes."""

# ---------------------------------------------------------------------------
# Known-bad fixtures. The gate must be PROVEN TO TRIP (artifact-rigor L4).
# Each fixture is injected, the gate must go RED and name the file; deleting the
# corresponding assertion must turn the gate's own selftest RED.
# ---------------------------------------------------------------------------

[[known_bad]]
invariant = "CORPUS-R1"
fixture = """manifest source {id="src-fixture-bad", capture="body-retained",
redistribution="not-licensed", path="knowledge/corpus/public/src-fixture-bad.txt"}"""
expect = "gate exits non-zero and names src-fixture-bad"

[[known_bad]]
invariant = "CORPUS-R2"
fixture = 'manifest source {id="src-fixture-norights"} with no rights key'
expect = "gate exits non-zero; absence must NOT be treated as permitted"

[[known_bad]]
invariant = "CORPUS-R3"
fixture = 'meta.toml with third_party_figures = ["Table 3-1"] and rights = "public-domain"'
expect = "gate exits non-zero and names the sidecar"

[[known_bad]]
invariant = "CORPUS-R4"
fixture = 'record with rights_review = "OPEN" and rights_review_reason = ""'
expect = "gate exits non-zero: bare exemption is a schema error"

[[known_bad]]
invariant = "CORPUS-R5"
fixture = "manifest with sources = []"
expect = "gate exits non-zero; must not report pass"

[[known_bad]]
invariant = "CORPUS-R6"
fixture = 'record with ai_ingestion = "PROHIBITED" and capture = "body-retained"'
expect = "gate exits non-zero and names the record"

[[known_bad]]
invariant = "CORPUS-R7"
fixture = """manifest source {capture="body-retained", redistribution="permitted",
rights="publisher-retains-copyright"} with no redistribution_evidence table"""
expect = "gate exits non-zero: a bare \"permitted\" over third-party copyright is not a licence"

[[known_bad]]
invariant = "CORPUS-R8"
fixture = "a .txt file dropped into knowledge/corpus/public/ that no record's `path` claims"
expect = "gate exits non-zero and names the unclaimed file"

# ---------------------------------------------------------------------------
# Known-GOOD fixtures. An attack-only suite ships an OVER-STRICT gate, and
# over-strict gates get routed around instead of fixed. Each of these must PASS,
# so that legitimate corpus growth stays possible.
# ---------------------------------------------------------------------------

[[known_good]]
invariant = "CORPUS-R1"
fixture = 'record with rights="public-domain", redistribution="permitted", capture="body-retained", path present on disk'
expect = "gate exits 0"

[[known_good]]
invariant = "CORPUS-R7"
fixture = """record with rights="open-licence", redistribution="permitted",
capture="body-retained" and redistribution_evidence {licence, url, clause} all non-empty"""
expect = "gate exits 0 — a recorded licence justification is the sanctioned way to keep a body"

# ---------------------------------------------------------------------------
# Open violations. Recorded here so the gate can be WIRED TODAY without going
# red on work that is already tracked. Every entry needs a bead. This table
# shrinks to empty; it must never grow without a bead.
# ---------------------------------------------------------------------------

# EMPTY as of 2026-08-14, closing bd-corpus-public-captures-not-licensed-class-kej.
#
# The entry that stood here listed ten records. It is struck because NINE bodies
# were removed from the published tree and reduced to citation rows, and the
# tenth (src-curriculum-map-local) was never a violation — it is this project's
# own work, swept in on an inherited default and corrected on the record.
#
# The stated blocker for the removal was that scripts/validate_grounding.py
# consumed these bodies as its grounding corpus, so deleting them would take the
# build red. That reading was wrong in a way worth keeping written down:
# 545,935 of the corpus's 659,149 characters come from OUTSIDE
# knowledge/corpus/public, and the gate's floor is 20,000 characters. The
# removal clears the floor at 28x. The gate never needed this material; what it
# needed — and got first, under bd-yje7 — was to stop reporting green on a corpus
# of zero characters, so that a corpus which really did disappear would go RED on
# the way down instead of silently passing. The vacuity fix is what made this
# removal observable. The legal remediation and the anti-vacuous fix were the
# same job seen from two ends.
#
# THE LIST IS EMPTY AND MUST STAY THAT WAY WITHOUT A BEAD. An entry here is an
# exception to an invariant, not a place to park work: it needs a bead, a reason,
# and an end date in someone's queue.
