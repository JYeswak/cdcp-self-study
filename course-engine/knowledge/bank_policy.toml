# Item bank pool policy — practice tests sample from a large library
schema_version = 1

# Official public exam form size (for mock assembly)
exam_n_items = 40

# Library size targets relative to exam_n_items
pool_min_multiplier = 10   # hard gate: at least 10× exam size
pool_target_multiplier = 20  # aspirational full library

# Derived floors (keep in sync with exam_n_items)
pool_min_items = 400
pool_target_items = 800

# Per-domain minimums so sampling cannot starve a module forever
# (sum of mins should be << pool_min; leftover free across heavy domains)
[[domain_min]]
module = 1
min_items = 20
[[domain_min]]
module = 2
min_items = 28
[[domain_min]]
module = 3
min_items = 20
[[domain_min]]
module = 4
min_items = 18
