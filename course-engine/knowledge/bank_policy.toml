# Assembly (mock practice tests)
[assembly]
mode = "sample_without_replacement"
seed_required = true
# Stratified: try to pull from multiple modules so mocks are not all power
stratify_by_module = true
# Soft caps so one domain cannot dominate a 40-item mock
max_per_module_in_mock = 8
min_modules_represented = 8
# Avoid recent items for the same learner when progress store exists (W6)
cooldown_recent_n = 80

[quality]
require_explanation = true
require_topic_ids = true
source_class = "original"
vary_correct_letter = true  # library should not be ~90% B
