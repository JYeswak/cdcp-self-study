id = "m12-q212"
kind = "single-select"
module = 12
stem = "Under 29 CFR 1910.165(d)(2), a non-supervised employee alarm system must have its reliability and adequacy tested:"
choices = [
  "Every two months, using a different actuation device for each test when the system has multiple actuation devices",
  "Only after an alarm event and never during normal operation",
  "Once every ten years with the same actuation device each time",
  "Only when a vendor changes the alarm panel"
]
correct = "A"
explanation = "The current OSHA public standard requires reliability and adequacy testing of non-supervised employee alarm systems every two months, with a different actuation device used in each test of a multi-actuation system so no individual device is used for two consecutive tests."
