# Original CDFOS daily-operations MCQ — ms4j.2 MOP control.
# Public heading: CDFOS "Facilities Maintenance — Maintenance operations procedures (MOP)" —
# https://www.epi-ap.com/services/1/3/136/Certified_Data_Centre_Facilities_Operations_Specialist_(CDFOS)
# Cite: 29 CFR 1910.147(c)(4)(i)-(ii)(D) and (c)(6), eCFR current 2026-08-14 —
# https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-J/section-1910.147
# Claim: a hazardous-energy procedure is developed, documented, and used; it includes
# effectiveness testing and periodic inspection. This does not define a universal MOP format.
# Options are length-balanced; teaching lives in explanation.
id = "m15-q357"
kind = "single-select"
module = 15
stem = "A maintenance-operations procedure (MOP) for a pump's hazardous-energy control is documented, but it has not been used to verify isolation effectiveness and has no periodic-inspection record. What control is missing?"
choices = [
  "Use the documented energy-control procedure, verify its effectiveness, and perform and certify the required periodic inspection",
  "Treat the approval signature as proof that isolation was verified and inspected",
  "Replace procedure use with the vendor's annual invoice",
  "Keep the test and inspection evidence optional because the MOP is already approved",
]
correct = "A"
explanation = "29 CFR 1910.147(c)(4) requires covered energy-control procedures to be developed, documented, and used, including specific steps for testing effectiveness. Paragraph (c)(6) requires at least annual periodic inspection and certification of the inspection record. The item applies those legal controls to the MOP's hazardous-energy scope and does not invent a general MOP revision cadence."
topic_ids = ["m15-documentation", "m15-maintenance-sla"]
objective_ids = []
bloom = "apply"
source_class = "original"
quantity_evidence = "qualitative_only"
status = "approved"
