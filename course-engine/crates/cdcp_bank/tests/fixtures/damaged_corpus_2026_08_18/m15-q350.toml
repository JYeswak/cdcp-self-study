# Options are length-balanced; the key is not the longest choice.
id = "m15-q350"
kind = "single-select"
module = 15
stem = "Which scope is explicitly included in ISO/IEC 27040:2024 storage security?"
choices = [
  "Devices and media during their lifetime and after end of use or end of life",
  "Only building access badges during a tenant move",
  "Only network links while storage hardware is powered off",
  "Only the purchase contract for newly acquired storage",
]
correct = "A"
explanation = "The ISO/IEC 27040:2024 public preview includes security of devices and media, management activities related to them, and control or monitoring of user activities during their lifetime and after end of use or end of life. It does not limit storage security to badges, powered-off links, or purchase contracts."
