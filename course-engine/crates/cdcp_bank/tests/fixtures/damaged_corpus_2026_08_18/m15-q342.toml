stem = "ISO 22301:2019 provides a business-continuity management-system framework to:"
choices = [
  "Prepare for, respond to, and recover from disruptive incidents",
  "Replace continuity planning with a service-catalogue label",
  "Replace recovery planning with a vendor invoice",
  "Treat alternate-site visitor badges as the whole continuity system",
]
correct = "A"
explanation = "The current ISO catalog describes ISO 22301:2019 as a framework to plan, establish, operate, monitor, review, maintain, and continually improve a business-continuity management system that protects against disruptions and supports recovery. It does not prescribe a data-centre cooling-capacity value or RTO."
