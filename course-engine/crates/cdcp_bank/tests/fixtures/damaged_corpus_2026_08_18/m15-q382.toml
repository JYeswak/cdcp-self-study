id = "m15-q382"
kind = "single-select"
module = 15
stem = "An organization chart for group lockout/tagout lists job titles but not the authorized employee with primary responsibility or the person coordinating affected workforces. What manager correction is supported?"
choices = [
  "Map primary responsibility, exposure-status accountability, and overall coordination to the group-lockout roles",
  "Keep titles only because a general procedure makes every role self-evident",
  "Assign all group-lockout decisions to the newest technician without authorization",
  "Replace the role map with a vendor contact list",
]
correct = "A"
explanation = "29 CFR 1910.147(f)(3) requires primary responsibility to be vested in an authorized employee, requires the authorized employee to ascertain group-member exposure status, and assigns overall coordination responsibility when more than one crew, craft, or department is involved. The item applies those bounded roles to an organization-chart review and does not create a general facilities org-chart taxonomy."
