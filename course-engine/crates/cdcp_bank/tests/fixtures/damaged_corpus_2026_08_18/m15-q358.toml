# Options are length-balanced; teaching lives in explanation.
id = "m15-q358"
kind = "single-select"
module = 15
stem = "Which objective is explicitly within ISO/IEC 22237-6:2024 physical-security scope for a data centre?"
choices = [
  "Protect against unauthorized access and intrusion using organizational and technological solutions",
  "Specify a universal badge-retention interval for every facility",
  "Replace physical security with a visitor-satisfaction survey",
  "Define a vendor's firmware report as the sole access record",
]
correct = "A"
explanation = "The ISO/IEC 22237-6:2024 public preview says the document specifies requirements and recommendations for data-centre physical security, including protection against unauthorized access and intrusion through organizational and technological solutions. It does not expose a universal badge-retention interval or a vendor-report rule."
