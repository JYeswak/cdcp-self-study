stem = "Under 29 CFR 1910.160(c)(4), automatic actuation of a hazardous total-flooding system must use:"
choices = [
  "An approved fire-detection device installed and interconnected with a pre-discharge employee alarm that gives employees time to exit safely",
  "Only a manual operator button with no approved detection device",
  "A cooling-control alarm with no employee warning",
  "An automatic door lock that removes the need for evacuation"
]
