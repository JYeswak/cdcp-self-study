# Fixture-local construction policy for the all-longest rank leg.

[longest_option_correct]
min_ratio_pct = 125
min_extra_words = 3

[rank_uniformity]
max_deviation_pct = 10
min_items = 4

[grammatical_disagreement]
min_disagreeing_distractors = 1

[absolute_language_distractors]
absolute_words = ["always", "never", "all", "none", "only"]
hedge_words = ["can", "could", "generally", "may", "might", "often", "usually", "typically", "tends", "sometimes"]
min_absolute_distractors = 1

[all_none_of_the_above]
min_matches = 1
