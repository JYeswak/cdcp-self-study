# F3 published-reference ledger (bd-hardening-f-oracle-qly.1;
# eGRID + free-cooling honesty: bd-hardening-f-oracle-qly.6).
#
# TOLERANCES IN THIS FILE WERE DECLARED BEFORE COMPUTED-VS-PUBLISHED
# WAS INSPECTED. Do not edit a tolerance to make a comparison green.
# A disagreement is RED and names location, computed, reference, delta.
#
# Comparison is |computed − reference| < tolerance (open interval).
# A one-tolerance-unit shift of a passing compute is therefore RED.
#
# Zero [[reference]] rows is an ERROR. Fewer than 5 distinct locations
# is an ERROR. Retrieval dates are required on every row.
#
# Free-cooling hours are NOT in this external ledger. STAT / ASHRAE / NREL
# do not publish a dry-bulb ≤ 18.33 °C hour count for these TMY3 stations.
# A same-file recount is MMS (`tests/mms_quantities.rs`), not an oracle.

schema = "cdcp.oracle.references.v1"

# ── tolerances (declared first) ───────────────────────────────────────────

[tolerance.heating_degree_days_18c]
abs = 5.0
unit = "°C·d"
justification = """
DOE EnergyPlus STAT publishes weather-file HDD as integers. Daily-mean
HDD (mean of 24 hourly dry-bulbs, then max(0, 18 − Tavg) per civil
day) is the EnergyPlus weather-statistics convention. 5 °C·d covers
hour-ending vs hour-beginning, STAT integer rounding, and TMY3's
28-day February, without being a post-hoc fit.
"""

[tolerance.cooling_degree_days_18c]
abs = 5.0
unit = "°C·d"
justification = """
Same justification as heating_degree_days_18c: STAT publishes integer
weather-file CDD; the compute is daily-mean CDD at base 18 °C. 5 °C·d
is the declared band for that integer publication and the same
hour-ending / February convention gap.
"""

[tolerance.seismic_ss]
abs = 0.015
unit = "g"
justification = """
USGS ASCE 7-16 design maps publish Ss to 3 decimal places (0.001 g).
We bilinear-interpolate a 0.05° local extract; USGS uses
linear-log-linear on its native grid. 0.015 g is 15× the published
last digit and 1/3 of the historical 0.05 g mapped contour interval.
"""

[tolerance.seismic_s1]
abs = 0.015
unit = "g"
justification = """
Same justification as seismic_ss: USGS publishes S1 to 0.001 g; we
bilinear-interpolate a 0.05° extract rather than USGS linear-log-linear.
0.015 g is the declared interpolation-method band.
"""

[tolerance.seismic_pga]
abs = 0.015
unit = "g"
justification = """
Same justification as seismic_ss, applied to mapped PGA (Site Class C,
Risk Category II). 0.015 g is the declared interpolation-method band
against USGS published point values.
"""

[tolerance.grid_co2_lb_per_mwh]
abs = 0.5
unit = "lb/MWh"
justification = """
EPA eGRID 2023 Rev 2 Summary Tables publish SRCO2RTA (subregion CO2
total output emission rate) to 3 decimals (0.001 lb/MWh). 0.5 lb/MWh
is 500× that last digit and ~0.07 % of a 700 lb/MWh rate — last-digit
rounding plus float accumulation, declared before official-vs-computed
was inspected. It does not absorb a plant-subset or output-rate vs
input-rate methodology gap; those stay RED.
"""

