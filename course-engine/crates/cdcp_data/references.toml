# ── published references ──────────────────────────────────────────────────
# HDD/CDD: DOE EnergyPlus STAT "annual (wthr file)" lines, base 18 °C.
# That is DOE's published analysis of the same TMY3 weather file.
# Retrieval 2026-08-15 from the STAT distributed with each TMY3 EPW.
#
# Seismic: USGS ASCE 7-16 design-maps web service, Site Class C, Risk
# Category II, at the location coordinates. Retrieval 2026-08-15.
#
# Grid carbon: official EPA eGRID 2023 Revision 2 (released 2025-06-12)
# Summary Tables, table "eGRID Subregion Total Output Emission Rates
# (lb/MWh)", CO2 column = SRCO2RTA. Retrieved 2026-08-15 from
# https://www.epa.gov/egrid/summary-data
# (xlsx https://www.epa.gov/system/files/documents/2025-06/summary_tables_rev2.xlsx).
# Compute is 2000×ΣPLCO2AN/ΣPLNGENAN over the official PLNT23
# population (`src-epa-egrid2023-plnt23`). Blank CO2 = 0; negative
# generation kept. That roll-up matches published SRCO2RTA inside
# the declared 0.5 lb/MWh band. Do not rewrite these published
# numbers if a future extract misses.

