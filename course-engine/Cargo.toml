[workspace]
resolver = "2"
members = [
  "crates/cdcp_core",
  "crates/cdcp_bank",
  "crates/cdcp_grade",
  "crates/cdcp_assemble",
  "crates/cdcp_cli",
  "crates/cdcp_registry_check",
  "crates/cdcp_gate",
  "crates/cdcp_wasm",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
cdcp_core = { path = "crates/cdcp_core" }
cdcp_bank = { path = "crates/cdcp_bank" }
cdcp_grade = { path = "crates/cdcp_grade" }
cdcp_wasm = { path = "crates/cdcp_wasm" }
cdcp_assemble = { path = "crates/cdcp_assemble" }
proptest = { version = "1", default-features = false, features = ["std"] }
