[workspace]
resolver = "2"
members = [
  "crates/cdcp_core",
  "crates/cdcp_bank",
  "crates/cdcp_grade",
  "crates/cdcp_assess",
  "crates/cdcp_attempts",
  "crates/cdcp_schedule",
  "crates/cdcp_assemble",
  "crates/cdcp_learn",
  "crates/cdcp_anki",
  "crates/cdcp_cli",
  "crates/cdcp_registry_check",
  "crates/cdcp_gate",
  "crates/cdcp_wasm",
  "crates/cdcp_evidence",
  "crates/cdcp_data",
  "crates/cdcp_site",
  "crates/cdcp_metrics",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
toml = "0.8"
# Color is off by construction (bd-installability-sm4g.5). Default features
# include `color` (anstream); CLICOLOR_FORCE then paints piped output.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
# Exact pins: assemble goldens are a ChaCha12 stream. A caret bump of `rand`
# used to be allowed to change StdRng; we no longer go through StdRng, and the
# crate that owns the stream is pinned here so cargo cannot move it quietly.
rand = "=0.8.7"
rand_chacha = "=0.3.1"
cdcp_core = { path = "crates/cdcp_core" }
cdcp_bank = { path = "crates/cdcp_bank" }
cdcp_grade = { path = "crates/cdcp_grade" }
cdcp_assess = { path = "crates/cdcp_assess" }
cdcp_attempts = { path = "crates/cdcp_attempts" }
cdcp_schedule = { path = "crates/cdcp_schedule" }
cdcp_wasm = { path = "crates/cdcp_wasm" }
cdcp_assemble = { path = "crates/cdcp_assemble" }
cdcp_learn = { path = "crates/cdcp_learn" }
cdcp_anki = { path = "crates/cdcp_anki" }
cdcp_evidence = { path = "crates/cdcp_evidence" }
cdcp_data = { path = "crates/cdcp_data" }
cdcp_site = { path = "crates/cdcp_site" }
cdcp_metrics = { path = "crates/cdcp_metrics" }
proptest = { version = "1", default-features = false, features = ["std"] }
