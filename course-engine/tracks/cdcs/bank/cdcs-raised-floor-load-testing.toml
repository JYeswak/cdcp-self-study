id = "cdcs-raised-floor-load-testing"
stem = "A raised-floor submittal lists only static load capacity and says the system was tested; it supplies no dynamic or impact loading evidence. What should the reviewer flag?"
choices = [
  "Reject the evidence as incomplete; require performance evidence for static, dynamic, and impact loading conditions.",
  "Accept the static value because dynamic and impact conditions are automatically covered by the same test.",
  "Replace the missing test records with the room's TIA rating and close the finding.",
  "Accept the submittal because raised floors have no loading condition beyond static weight.",
]
correct = "A"
explanation = "ANSI/TIA-569-E:2019 §9.6.2 points to performance information for static, dynamic, and impact loading conditions through the CISCA Recommended Test Procedures for Access Floors. A static-only row does not establish the other conditions."
item_class = "one-line-defect"
objective_ids = ["cdcs-obj-raised-floor-testing"]
source_ids = ["epi-cdcs-outline", "tia-569-e-2019", "tia-569-e-2019-preview"]
work = "Defect: static-only test evidence; dynamic and impact loading evidence is missing → reject the incomplete record."
