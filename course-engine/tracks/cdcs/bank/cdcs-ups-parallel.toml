id = "cdcs-ups-parallel"
stem = "A two-unit UPS parallel offer shows one output path with half the impedance of the other and claims that N+1 alone proves equal current sharing. What is the one-line defect to raise?"
choices = [
  "Unequal impedance can produce unequal sharing or overload; request controls, bypass, cabling, and protection evidence.",
  "N+1 makes impedance irrelevant because the spare unit absorbs every imbalance.",
  "The only defect is that the offer uses two units instead of one larger unit.",
  "Equal sharing is guaranteed whenever both nameplates show the same kVA.",
]
correct = "A"
explanation = "Parallel capacity is not a proof of current sharing. The path impedance, controls, bypass arrangement, and protection coordination must support the claimed operating mode."
item_class = "one-line-defect"
