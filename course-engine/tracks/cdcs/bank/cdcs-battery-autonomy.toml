id = "cdcs-battery-autonomy"
stem = "A vendor's illustrative battery model lists 480 V DC, 600 Ah nominal capacity, a 0.85 usable fraction, and 0.90 DC-to-AC efficiency. At a steady 180 kW load, what first-pass runtime does this arithmetic imply before temperature, aging, and discharge-curve checks?"
choices = [
  "30.6 minutes",
  "73.4 minutes",
  "102.0 minutes",
  "163.2 minutes",
]
correct = "B"
explanation = "480 × 600 × 0.85 × 0.90 gives 220.32 kWh; 220.32 ÷ 180 × 60 is about 73.4 minutes. This is a stated arithmetic screen, not a vendor runtime guarantee."
item_class = "calculation"
objective_ids = ["cdcs-obj-battery-autonomy"]
source_ids = ["epi-cdcs-outline", "ieee-485-2020", "schneider-ups-runtime", "schneider-ups-sizing"]
work = "480 V × 600 Ah × 0.85 × 0.90 ÷ 180 kW = 1.224 h = 73.4 min"
source_class = "original"
status = "approved"
