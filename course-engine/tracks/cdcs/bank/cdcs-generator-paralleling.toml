id = "cdcs-generator-paralleling"
stem = "Two generator sets are shown closing onto a common bus with no synchronizing or phase-sequence interlock shown. What is the specialist's first rejection?"
choices = [
  "Accept the closure because equal kW nameplates prove safe paralleling.",
  "Reject the closure until synchronization, voltage, frequency, phase sequence, load sharing, and protection evidence is shown.",
  "Remove all controls so the alternators find their own common frequency.",
  "Treat phase sequence as a commissioning detail that cannot affect the bus.",
]
correct = "B"
explanation = "A common-bus closure needs synchronized electrical conditions and protective/load-sharing controls. The missing interlock is a safety and design evidence defect, not a cosmetic drawing omission."
