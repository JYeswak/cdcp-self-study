id = "cdcs-rating-nameplate-scope"
stem = "A project slide and a UPS nameplate both say 'Rated-3 compliant,' but the file contains no TIA-942 Design, Facilities, or Ready certification type, audit scope, or certificate date. What should the reviewer catch?"
choices = [
  "Reject the site-rating claim; a component label cannot substitute for the named TIA certification type, scope, and current evidence.",
  "Accept it because a UPS nameplate proves the whole facility's Rated level.",
  "Convert Rated-3 into an uptime percentage and accept the nameplate as the certificate.",
  "Treat the certification type as optional because all TIA ratings use the same audit.",
]
correct = "A"
explanation = "TIA's current public certification page separates Design, Facilities, and Ready certifications and describes the four site rating levels. A UPS nameplate is not evidence that the facility received a particular TIA-942 certification for a defined scope and date."
item_class = "one-line-defect"
objective_ids = ["cdcs-obj-rating-evidence"]
source_ids = ["epi-cdcs-outline", "tia-942-c-2024", "tia-942-ratings"]
work = "Defect: a component nameplate is treated as a facility certification; require the TIA certification type, audited scope, edition, and validity evidence."
source_class = "original"
status = "approved"
