id = "cdcs-emf-unit-conversion"
stem = "An EMF survey reports 1.2 mT at the reference point and 8 G at the work point, then labels the reference-to-work attenuation ratio as 0.15. Using NIST's 1 G = 10⁻⁴ T conversion, what ratio does the measured pair support?"
choices = [
  "1.5; 8 G is 0.8 mT, so 1.2 mT ÷ 0.8 mT = 1.5.",
  "0.15; the displayed number is already a ratio.",
  "9.2; add the two readings after converting only the gauss value.",
  "0.00096; multiply the values while retaining different units.",
]
correct = "A"
explanation = "NIST converts 8 G to 8 × 10⁻⁴ T = 0.8 mT. The same-unit measured ratio is 1.2 mT ÷ 0.8 mT = 1.5. IEEE C95.3-2021 is the measurement/computation practice anchor; this result is only for the stated pair, not an exposure limit or universal distance law."
item_class = "calculation"
objective_ids = ["cdcs-obj-emf-units"]
source_ids = ["epi-cdcs-outline", "ieee-c95-3-2021", "nist-si-appendix-b9"]
work = "8 G = 0.8 mT; 1.2 mT ÷ 0.8 mT = 1.5× measured attenuation."
source_class = "original"
