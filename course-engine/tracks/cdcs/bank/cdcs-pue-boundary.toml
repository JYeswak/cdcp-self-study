id = "cdcs-pue-boundary"
stem = "Using the ISO/IEC 30134-2:2026 PUE definition, a facility reports 1,200,000 kWh of total data-centre energy and 800,000 kWh of IT-equipment energy for the same continuous 12-month boundary. What PUE does the report support?"
choices = [
  "0.67",
  "1.50",
  "2.00",
  "400,000 kWh",
]
correct = "B"
explanation = "PUE is total data-centre energy divided by IT-equipment energy over the same period and boundary: 1,200,000 ÷ 800,000 = 1.50. A mismatched period or boundary would not support this calculation."
item_class = "calculation"
objective_ids = ["cdcs-obj-pue"]
source_ids = ["epi-cdcs-outline", "iso-30134-2-2026", "iso-30134-2-2026-obp"]
work = "PUE = E_DC ÷ E_IT = 1,200,000 kWh ÷ 800,000 kWh = 1.50"
source_class = "original"
status = "approved"
