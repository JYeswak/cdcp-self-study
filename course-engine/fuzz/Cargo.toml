[package]
name = "cdcp-course-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.cdcp_core]
path = "../crates/cdcp_core"

[[bin]]
name = "choice_letter_parse"
path = "fuzz_targets/choice_letter_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_json_bytes"
path = "fuzz_targets/canonical_json_bytes.rs"
test = false
doc = false
bench = false
